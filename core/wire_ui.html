<!doctype html>
<html lang="__BOARD_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src __BOARD_CONNECT__; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
<title data-i18n="TidyFileTree · 连线工作台">TidyFileTree · 连线工作台</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7fb;--paper:#fff;--tint:#eef3fa;--tint-2:#e5eefb;--ink:#142038;--muted:#586a84;--line:#d6e0ee;--accent:#245bcc;--accent-soft:#eaf1ff;--wire:#3470e7;--ok:#126b52;--ok-bg:#e8f7f1;--warn:#8c4a08;--warn-bg:#fff4e5;--danger:#b42318;--danger-bg:#fef0ef;--focus:#245bcc;--shadow:0 1px 2px rgba(15,28,50,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1621;--paper:#172231;--tint:#1e2c40;--tint-2:#253750;--ink:#ebf2fc;--muted:#9cb0ca;--line:#2f425b;--accent:#8ab4ff;--accent-soft:#1c3150;--wire:#75a6ff;--ok:#78dbb9;--ok-bg:#17352c;--warn:#ffca85;--warn-bg:#3b2b18;--danger:#ff9b93;--danger-bg:#3c1e22;--focus:#8ab4ff;--shadow:0 1px 3px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1621;--paper:#172231;--tint:#1e2c40;--tint-2:#253750;--ink:#ebf2fc;--muted:#9cb0ca;--line:#2f425b;--accent:#8ab4ff;--accent-soft:#1c3150;--wire:#75a6ff;--ok:#78dbb9;--ok-bg:#17352c;--warn:#ffca85;--warn-bg:#3b2b18;--danger:#ff9b93;--danger-bg:#3c1e22;--focus:#8ab4ff;--shadow:0 1px 3px rgba(0,0,0,.3)}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:5px 10px;transition:border-color .15s,background-color .15s,color .15s}
button:hover:not(:disabled){border-color:var(--accent);background:var(--tint)}
button:disabled{opacity:.48;cursor:default}
input,select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand-group{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{display:inline-block;position:relative;width:18px;height:13px;border:1.8px solid var(--accent);border-radius:3px;flex:none;margin-top:3px}
.brand-icon::before{content:"";position:absolute;left:-1.8px;top:-5px;width:8px;height:4.5px;border:1.8px solid var(--accent);border-bottom:0;border-radius:2px 2px 0 0}
header h1{font-size:17px;margin:0;letter-spacing:-.01em}
header small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.actions{display:flex;align-items:center;gap:6px;flex:none}
.ghost-btn{border-color:transparent;background:transparent;color:var(--muted);padding:5px 8px}
.ghost-btn:hover:not(:disabled){border-color:var(--line);background:var(--tint);color:var(--ink)}
.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:650}
.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent);filter:brightness(1.08)}
.status-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:8px 20px;font-size:13px;background:var(--paper);border-bottom:1px solid var(--line)}
.status-metrics{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.metric-pill{display:inline-flex;align-items:center;gap:5px;font-weight:650;color:var(--ink)}
.metric-pill.warn{color:var(--warn)}
.metric-pill.ok{color:var(--ok)}
.metric-note{color:var(--muted);font-size:12.5px}
.conflict-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--danger);background:var(--danger-bg);border:1px solid var(--danger)}
.filter-chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent)}
.filter-chip button{border:0;background:transparent;padding:0 2px;font-weight:700;color:inherit}
.wire-mode-btn{font-size:12px;padding:2px 9px;border-radius:99px;color:var(--muted)}
.wire-mode-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.load-more-btn{display:block;width:100%;margin:4px 0 8px;font-size:12.5px;color:var(--accent);background:var(--paper);border-style:dashed}
#board{display:grid;grid-template-columns:minmax(310px,1.08fr) clamp(88px,15vw,220px) minmax(280px,.92fr);min-height:0;position:relative;padding:0 16px;overflow:hidden;background:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.pane{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.left{grid-column:1}.right{grid-column:3}
.pane-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 4px 8px}
.pane-head h2{font-size:13.5px;margin:0 auto 0 0;font-weight:650;color:var(--muted)}
.pane-head input{min-width:88px;width:min(100%,170px);font-size:13px;padding:4px 8px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--tint);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:4px 9px;border-radius:6px;font-weight:550}
.tab:hover:not(:disabled){background:var(--tint-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:650;box-shadow:var(--shadow)}
.tab .cnt{opacity:.72;margin-left:3px;font-variant-numeric:tabular-nums}
.pane-scroll{overflow:auto;min-height:0;padding:4px 12px 20px 4px;scrollbar-width:thin;position:relative}
.right .pane-scroll{padding:4px 12px 20px 14px}
.card,.target{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;position:relative;min-width:0;box-shadow:var(--shadow);transition:border-color .14s,box-shadow .14s,background-color .14s}
.card{padding:10px 24px 9px 12px;cursor:pointer}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.card.focused{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.card.selected,.target.hot{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-soft)}
.card.is-linked{border-left:3px solid var(--wire);background:color-mix(in srgb,var(--paper) 94%,var(--tint))}
.card.is-keep{border-left:3px solid var(--ok)}
.card.conflict-card{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-title-wrap{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;min-width:0}
.card h3,.target-label{margin:0;font-size:14px;overflow-wrap:anywhere;font-weight:650}
.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.guidance{margin:5px 0 0;font-size:12.5px;color:var(--muted);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.guidance strong{color:var(--ink);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;line-height:1.4;background:var(--tint);color:var(--muted);white-space:nowrap}
.badge.decide{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.badge.ai-pick{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-weight:650}
.badge.alt-pick{color:var(--muted);background:var(--tint)}
.badge.linked{color:var(--ok);background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent);font-weight:600}
.badge.partial{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.badge-btn{cursor:pointer}
.badge-btn:hover{border-color:var(--accent)}
.card-footer{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px}
.card-btn{padding:3px 9px;font-size:12px;border-radius:6px}
.card-btn.accept-btn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft);font-weight:600}
.card-btn.accept-btn:hover{background:var(--accent);color:var(--paper)}
.card-btn.skip-btn{color:var(--muted);border-color:transparent;background:transparent;padding:3px 6px}
.card-btn.skip-btn:hover{color:var(--ink);background:var(--tint)}
details{margin-top:4px}
summary{cursor:pointer;color:var(--muted);width:fit-content;font-size:12px;user-select:none}
summary:hover{color:var(--accent)}
.evidence{padding:7px 9px;margin:5px 0 6px;font-size:12px;background:var(--tint);border-radius:7px;display:grid;gap:4px}
.unit{position:relative;padding:7px 26px 7px 8px;margin-right:-16px;border-top:1px solid var(--line);overflow-wrap:anywhere;border-radius:4px;cursor:pointer}
.unit:hover{background:var(--tint)}
.unit.selected{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
/* Node-editor edge-straddling ports */
.port{position:absolute;display:grid;place-items:center;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:transparent;padding:0;z-index:4;touch-action:none}
.port:hover:not(:disabled){background:transparent}
.port::after{content:'';width:12px;height:12px;border:2px solid var(--wire);border-radius:50%;background:var(--paper);transition:transform .12s,background-color .12s,box-shadow .12s}
.port.filled::after{background:var(--wire)}
.port.filled-keep::after{border-color:var(--ok);background:var(--ok)}
.port:hover::after,.port.active::after{background:var(--wire);transform:scale(1.2);box-shadow:0 0 0 4px var(--accent-soft)}
.source-port{right:-13px;cursor:crosshair}
.group-port{top:24px}
.target-port{left:-13px}
.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 6px;font-size:12px;font-weight:650;color:var(--muted);padding:0 2px}
.section-label.ai-head{color:var(--accent);margin-top:0}
.for-pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--paper);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));color:var(--ink);max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-box{padding:10px 10px 3px 10px;margin:0 -10px 14px -10px;border-radius:12px;background:color-mix(in srgb,var(--accent-soft) 62%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line))}
.target{padding:8px 10px 8px 18px;display:flex;gap:7px;align-items:center}
#right.can-connect .target{cursor:pointer}
#right.can-connect .target:hover{border-color:var(--accent);background:var(--accent-soft)}
#right.can-connect .target.keep-target:hover{border-color:var(--ok);background:var(--ok-bg)}
.connect-cue{display:none;font-size:11px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--paper);white-space:nowrap;flex:none}
.target.keep-target .connect-cue{background:var(--ok)}
#right.can-connect .target:hover .connect-cue{display:inline-flex}
.target.is-primary-rec{border-color:var(--accent);background:var(--paper);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 12%,transparent)}
.target.keep-target{border-style:dashed}
.target.keep-target .port::after{border-color:var(--ok)}
.target.keep-target .port:hover::after{background:var(--ok)}
.target.active-target{border-color:var(--ok)}
.target.linked-peer{box-shadow:0 0 0 2px var(--accent-soft);border-color:var(--accent)}
.target.flash-target{animation:flashRing 1.1s ease-out}
@keyframes flashRing{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:var(--shadow)}}
.target-ico{width:15px;height:15px;flex:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.target.is-primary-rec .target-ico{color:var(--accent)}
.target.keep-target .target-ico{color:var(--ok)}
.target-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.target-hint{font-size:11px;color:var(--muted)}
.target-expand{width:20px;height:20px;padding:0;border-radius:5px;font-size:11px;display:grid;place-items:center;color:var(--muted);background:var(--tint);flex:none}
.target.child{margin-left:18px;padding-left:16px}
.target.child::before{content:"";position:absolute;left:-11px;top:-9px;bottom:50%;width:10px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-left-radius:4px;pointer-events:none}
.count-btn{padding:1px 7px;border-radius:99px;font-size:11px;font-weight:650;color:var(--ok);background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);font-variant-numeric:tabular-nums;flex:none}
.count-btn:hover,.count-btn.filtering{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.new-target-form{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.new-target-form input{flex:1;min-width:0;font-size:12.5px}
.new-target-form button{font-size:12.5px;padding:4px 10px}
.wire-svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.wire{fill:none;stroke:var(--wire);stroke-width:2.3;stroke-linecap:round;opacity:.85;pointer-events:none;transition:opacity .12s,stroke-width .12s,stroke .12s}
.wire.keep-wire{stroke:var(--ok);stroke-dasharray:5 4}
.wire.suggest-wire{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 5;opacity:.62;animation:flowDash 1.1s linear infinite}
.wire.hover-preview-wire{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 4;opacity:.92;animation:flowDash .8s linear infinite}
.wire.hover-preview-wire.keep-wire{stroke:var(--ok)}
@keyframes flowDash{to{stroke-dashoffset:-20}}
@media(prefers-reduced-motion:reduce){.wire.suggest-wire{animation:none}}
.wire.offscreen-wire{stroke-dasharray:3 4;opacity:.42}
.wire.dimmed{opacity:.14}
.wire.emph{stroke-width:3.4;opacity:1}
.wire-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.wire-hit:hover+.wire{stroke:var(--danger);stroke-width:3.5;opacity:1;stroke-dasharray:none}
.draft{stroke-dasharray:6 5;opacity:.92;stroke-width:2.6}
.unlink{padding:2px 8px;font-size:12px;border-radius:6px}
.empty{color:var(--muted);padding:20px 12px;text-align:center;font-size:13px;background:var(--paper);border:1px dashed var(--line);border-radius:10px}
footer{padding:7px 20px;color:var(--muted);border-top:1px solid var(--line);background:var(--paper);font-size:12px}
dialog{width:min(780px,calc(100% - 22px));max-height:86vh;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0;box-shadow:0 16px 48px rgba(7,19,35,.3)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#0713239a;backdrop-filter:blur(2px)}
.dialog-head{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.dialog-head h2{font-size:18px;margin:0}
.dialog-body{padding:12px 18px;overflow:auto;flex:1;min-height:0}
dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:36vh;overflow:auto;font-size:12px}
.conflict-box{padding:10px 12px;margin:0 0 12px;border-radius:8px;background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);font-size:13px}
.conflict-box ul{margin:6px 0 0;padding-left:18px;overflow-wrap:anywhere}
.cli-box{margin:10px 0 14px;padding:10px 12px;border-radius:8px;background:var(--tint);border:1px solid var(--line)}
.cli-box-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;font-size:12px;font-weight:650;color:var(--muted)}
.cli-box code{display:block;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;color:var(--ink)}
.dialog-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:10px 18px;border-top:1px solid var(--line);background:var(--paper);border-radius:0 0 14px 14px}
#proposalList{padding-left:18px;margin:8px 0}
#proposalList li{margin-bottom:12px}
#correctionRows{display:grid;gap:10px;margin:10px 0 6px}
.correction-row{display:grid;grid-template-columns:minmax(110px,1fr) repeat(3,minmax(120px,1.25fr));gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--tint)}
.correction-row label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.correction-row input{width:100%;min-width:0;color:var(--ink)}
@media(max-width:740px){.correction-row{grid-template-columns:1fr 1fr}.correction-row strong{grid-column:1/-1}header{padding:8px 10px;align-items:flex-start;gap:5px}header h1{font-size:15px}.actions{flex-wrap:wrap;justify-content:flex-end}.actions button,.actions select{font-size:12px}.status-bar{padding:6px 10px}#board{padding:0 4px;grid-template-columns:minmax(0,1.1fr) 42px minmax(0,1fr)}.pane-head{font-size:12px}.card h3,.target-label{font-size:12.5px}.target.child{margin-left:10px}.pane-scroll{padding:4px 8px 14px 2px}.right .pane-scroll{padding:4px 2px 14px 8px}}
</style>
</head>
<body>
<header>
  <div class="brand-group"><span class="brand-icon" aria-hidden="true"></span><div><h1 data-i18n="TidyFileTree 连线工作台">TidyFileTree 连线工作台</h1><small title="__ROOT__">__ROOT__</small></div></div>
  <div class="actions">
    <select id="language" aria-label="语言" data-i18n-aria-label="语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select>
    <button id="undoButton" class="ghost-btn" aria-label="撤销连线" data-i18n-aria-label="撤销连线" data-i18n="撤销">撤销</button>
    <button id="redoButton" class="ghost-btn" aria-label="重做连线" data-i18n-aria-label="重做连线" data-i18n="重做">重做</button>
    <button id="protectedButton" class="ghost-btn" hidden></button>
    <button id="proposalsButton" class="ghost-btn" data-i18n="候选类别">候选类别</button>
    <button id="reviewButton" class="primary" data-i18n="导出计划">导出计划</button>
    <button id="theme" class="ghost-btn" aria-label="切换明暗主题" data-i18n-aria-label="切换明暗主题">◐</button>
  </div>
</header>
<div class="status-bar">
  <div class="status-metrics">
    <span class="metric-pill" id="decideMetric"></span>
    <span class="metric-pill ok" id="moveMetric"></span>
    <span class="metric-note" id="keepMetric" hidden></span>
    <span class="metric-pill warn" id="staleMetric" role="status" hidden></span>
    <button type="button" class="conflict-pill" id="conflictPill" hidden></button>
    <span class="filter-chip" id="targetFilterChip" hidden><span id="targetFilterText"></span><button type="button" id="clearTargetFilter" aria-label="清除目标筛选" data-i18n-aria-label="清除目标筛选">×</button></span>
    <button type="button" class="wire-mode-btn" id="focusWiresBtn" aria-pressed="false" hidden></button>
  </div>
  <span class="metric-note" data-i18n="未连线项将留在原处，只连需要移动的即可">未连线项将留在原处，只连需要移动的即可</span>
</div>
<main id="board" aria-label="整理连线" data-i18n-aria-label="整理连线">
  <svg class="wire-svg" id="wires" aria-hidden="true"></svg>
  <section class="pane left" aria-label="来源" data-i18n-aria-label="来源">
    <div class="pane-head">
      <div class="tabs" id="viewTabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="decide" aria-selected="false"></button>
        <button type="button" class="tab" role="tab" data-tab="moves" aria-selected="false"></button>
        <button type="button" class="tab" role="tab" data-tab="linked" aria-selected="false"></button>
        <button type="button" class="tab" role="tab" data-tab="all" aria-selected="false"></button>
      </div>
      <input id="groupSearch" type="search" aria-label="搜索分组" data-i18n-aria-label="搜索分组" placeholder="分组或来源" data-i18n-placeholder="分组或来源">
    </div>
    <div class="pane-scroll" id="left"></div>

  if (!pointer || event.pointerId !== pointer.id) return;
  const target = hitTarget(event);
  const previous = pointer;
  pointer = null;
  for (const element of $('right').querySelectorAll('.hot')) element.classList.remove('hot');
  if (target && previous.moved && active) assign(active,target.dataset.target);
  else {
    if (previous.moved || (previous.prior?.group === active?.group && previous.prior?.unit === active?.unit)) active = null;
    markActive(); scheduleDraw();
  }
});
document.addEventListener('pointercancel',() => {
  if (pointer) {pointer = active = null; markActive(); scheduleDraw();}
});
document.addEventListener('keydown',event => {
  if (event.key === 'Escape' && active) {pointer = active = null; markActive(); scheduleDraw();}
  const editing=event.target.matches('input,textarea,select,[contenteditable="true"]') || event.target.closest('[contenteditable="true"]');
  const modalOpen=[...document.querySelectorAll('dialog')].some(d=>d.open);
  if ((event.ctrlKey||event.metaKey) && !editing && !modalOpen && event.key.toLowerCase()==='z') {event.preventDefault(); if(event.shiftKey){if(redoStack.length)restore(redoStack.pop(),undoStack);}else if(undoStack.length)restore(undoStack.pop(),redoStack);}
  if ((event.ctrlKey||event.metaKey) && !editing && !modalOpen && event.key.toLowerCase()==='y') {event.preventDefault(); if(redoStack.length)restore(redoStack.pop(),undoStack);}
});
$('left').addEventListener('mouseover',event => {
  const unit = event.target.closest('.unit');
  const card = event.target.closest('[data-card]');
  const next = unit ? {group:unit.dataset.group,unit:unit.dataset.unit} : card ? {group:card.dataset.card,unit:''} : null;
  if (hoverFocus?.group !== next?.group || hoverFocus?.unit !== next?.unit || hoverFocus?.target) {
    hoverFocus = next;
    scheduleDraw();
  }
});
$('left').addEventListener('mouseleave',() => {
  if (hoverFocus?.group) { hoverFocus = null; scheduleDraw(); }
});
$('right').addEventListener('mouseover',event => {
  const row = event.target.closest('[data-target]');
  const next = row ? {target:row.dataset.target} : null;
  if (hoverFocus?.target !== next?.target || hoverFocus?.group) {
    hoverFocus = next;
    scheduleDraw();
  }
});
$('right').addEventListener('mouseleave',() => {
  if (hoverFocus?.target) { hoverFocus = null; scheduleDraw(); }
});
$('viewTabs').addEventListener('click',event => {
  const tab = event.target.closest('.tab');
  if (!tab) return;
  currentTab = tab.dataset.tab;
  leftLimit = 50;
  $('groupSearch').value = '';
  filterTarget = null;
  refresh();
});
$('focusWiresBtn').addEventListener('click',() => {
  focusWiresOnly = !focusWiresOnly;
  $('focusWiresBtn').setAttribute('aria-pressed', String(focusWiresOnly));
  $('focusWiresBtn').textContent = t(focusWiresOnly ? '显示全部连线' : '仅看聚焦连线');
  scheduleDraw();
});
$('left').addEventListener('click',event => {
  const button = event.target.closest('button');
  if (button) {
    if (button.dataset.action === 'more-groups') { leftLimit += 50; renderLeft(); markActive(); scheduleDraw(); return; }
    if (button.dataset.action === 'more-units') {
      const g = byGroup.get(button.dataset.group);
      if (g) {
        unitLimits.set(g.id, (unitLimits.get(g.id) ?? 30) + 50);
        const body = button.closest('.details-body');
        if (body) body.innerHTML = renderDetailsBody(g);
        markActive(); scheduleDraw();
      }
      return;
    }
    if (button.dataset.action === 'unlink') { unlink(button.dataset.group,button.dataset.unit); return; }
    if (button.dataset.action === 'approve-rename' || button.dataset.action === 'keep-rename') {
      const g = byGroup.get(button.dataset.group);
      if (!g?.rename) return;
      const key = g.keys[0];
      const target = button.dataset.action === 'approve-rename' ? renameChoices.get(key)?.token : KEEP;
      if (!target || !allowedAssignment(key,target) || places.get(key) === target) return;
      snapshot();
      places.set(key,target);
      active = pointer = null;
      advanceFocus(g.id);
      save(); refresh();
      return;
    }
    if (button.dataset.action === 'override-group') {
      active = {group:button.dataset.group,unit:'',override:true};
      focusedGroupId = active.group;
      renderRight(); markActive(); scheduleDraw(); return;
    }
    if (button.dataset.action === 'apply-suggestion') {
      const g = byGroup.get(button.dataset.group);
      if (g?.suggest.target) assign({group:g.id,unit:''}, g.suggest.target);
      return;
    }
    if (button.dataset.action === 'skip-next') {
      advanceFocus(button.dataset.group);
      renderLeft(); renderRight(); markActive(); scheduleDraw();
      return;
    }
    if (button.dataset.action === 'jump-target') { jumpToTarget(button.dataset.dest); return; }
    if (button.hasAttribute('data-source') && event.detail === 0) {
      active = {group:button.dataset.group,unit:button.dataset.unit || ''};
      focusedGroupId = active.group;
      renderRight(); markActive(); scheduleDraw();
    }
    return;
  }
  if (event.target.closest('summary')) return;
  const unit = event.target.closest('.unit');
  if (unit) {
    const same = active && active.group === unit.dataset.group && active.unit === unit.dataset.unit;
    active = same ? null : {group:unit.dataset.group,unit:unit.dataset.unit};
    focusedGroupId = unit.dataset.group;
    renderRight(); markActive(); scheduleDraw();
    return;
  }
  const card = event.target.closest('[data-card]');
  if (card) {
    const changed = card.dataset.card !== focusedGroupId || active !== null;
    active = null;
    focusedGroupId = card.dataset.card;
    if (changed) { renderLeft(); renderRight(); markActive(); scheduleDraw(); }
  }
});
$('left').addEventListener('toggle',event => {
  const details = event.target;
  if (!details.dataset.details || !details.isConnected) return;
  const id = details.dataset.details;
  if (details.open) {
    openGroups.add(id);
    const body = details.querySelector('.details-body');
    const g = byGroup.get(id);
    if (body && !body.childElementCount && g) body.innerHTML = renderDetailsBody(g);
  } else {
    openGroups.delete(id);
  }
  if (!details.open && active) {cancelHiddenSelection(); markActive();}
  scheduleDraw();
},true);
$('right').addEventListener('click',event => {
  const toggle = event.target.closest('[data-zone]');
  if (toggle) {
    const name = toggle.dataset.zone;
    if (openZones.has(name)) openZones.delete(name); else openZones.add(name);
    renderRight(); scheduleDraw(); return;
  }
  const filterBtn = event.target.closest('[data-filter-target]');
  if (filterBtn && !active) {
    const dest = filterBtn.dataset.filterTarget;
    filterTarget = filterTarget === dest ? null : dest;
    refresh(); return;
  }
  const target = event.target.closest('[data-target]');
  if (!target) return;
  const src = connectSource();
  if (src) {
    assign(src, target.dataset.target);
  } else if (focusedGroupId) {
    selectionNotice = t('该组已全部指定去向；如需调整，请点「改选目标…」。');
    markActive();
  }
});
$('right').addEventListener('submit',event => {
  if (event.target.id !== 'newTargetForm') return;
  event.preventDefault();
  const input = $('newTargetInput');
  if (input && input.value.trim()) addCustomTarget(input.value);
});
$('clearTargetFilter').addEventListener('click',() => {filterTarget = null; refresh();});
$('conflictPill').addEventListener('click',showReview);
for (const id of ['left','right']) $(id).addEventListener('scroll',scheduleDraw,{passive:true});
window.addEventListener('resize',scheduleDraw);
$('groupSearch').addEventListener('input',() => {leftLimit = 50; renderLeft(); cancelHiddenSelection(); renderRight(); markActive(); scheduleDraw();});
$('targetSearch').addEventListener('input',() => {renderRight(); scheduleDraw();});
$('theme').addEventListener('click',() => {
  const current = document.documentElement.dataset.theme;
  const dark = current ? current === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try {localStorage.setItem(themeKey,next);} catch (_) {}
});
function quoteArg(value) {
  const text = String(value);
  if (rootSep === '\\') return "'" + text.replace(/'/g, "''") + "'";
  return "'" + text.replace(/'/g, "'\"'\"'") + "'";
}
async function copyText(text, button, labelKey) {
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = t('已复制');
    setTimeout(() => { button.textContent = t(labelKey); }, 1500);
  } catch (_) {
    const range = document.createRange();
    range.selectNodeContents($('previewCmdText'));
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  }
}
function collectReview() {
  const actions = plannedActions(), pending = [], reviewOnly = [], kept = [];
  for (const g of groups) {
    const entries = g.units.length ? g.units : [{key:g.id,label:g.name,source:null}];
    for (const u of entries) {
      const target = places.get(u.key);
      const display = `${g.node.name} / ${g.name} / ${u.label}`;
      if (!target) pending.push(display);
      else if (target === KEEP) kept.push(display);
      else if (!u.source || !u.sourceWitness) reviewOnly.push(`${display} → ${label(target)}`);
    }
  }
  return {actions,pending,reviewOnly,kept,conflicts:computeConflicts(actions)};
}
function showReview() {
  const r = collectReview();
  exportRows = r.conflicts.size ? [] : r.actions.map(action => action.row);
  $('submitStatus').hidden = true;
  $('submitActions').hidden = !LIVE;
  $('submitActions').disabled = !exportRows.length;
  const describe = ({row,target}) => `${row[1]} → ${target}`;
  const sections = [
    [t('待移动'),r.actions.filter(action => action.row[0] === 'move').map(describe)],
    [t('待改名'),r.actions.filter(action => action.row[0] === 'rename').map(describe)],
    [t('待连'),r.pending],[t('仅复核（缺少已确认来源）'),r.reviewOnly],[t('保持原位'),r.kept],
  ];
  $('reviewStatus').textContent = r.conflicts.size
    ? t('以下动作存在来源或落点冲突，请先取消冲突的安排。')
    : t(LIVE ? '共 {actions} 项拟操作，{pending} 项未确认将留在原处。提交后可回到进度页查看预演状态。'
      : '共 {actions} 项待执行，{pending} 项未确认将留在原处。下载动作表后，请先预演，再使用同一份预演清单执行。',{actions:r.actions.length,pending:r.pending.length});
  $('reviewConflicts').hidden = !r.conflicts.size;
  if (r.conflicts.size) {
    $('reviewConflicts').innerHTML = `<strong>${esc(t('冲突路径（{count}）',{count:r.conflicts.size}))}</strong><ul>${[...r.conflicts.values()].map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;
  }
  const previewCmd = `tidy-file-tree apply ${quoteArg(DATA.root)} --actions tidy-file-tree-actions.tsv --dry-run --preview-html plan.html --receipt plan.tidy-file-tree-receipt.json`;
  const applyCmd = `tidy-file-tree apply ${quoteArg(DATA.root)} --actions tidy-file-tree-actions.tsv --receipt plan.tidy-file-tree-receipt.json`;
  $('reviewCommands').hidden = LIVE || !exportRows.length;
  $('previewCmdText').textContent = previewCmd;
  $('copyPreviewCmd').onclick = () => copyText(previewCmd, $('copyPreviewCmd'), '复制预演命令');
  $('copyApplyCmd').onclick = () => copyText(applyCmd, $('copyApplyCmd'), '复制执行命令');
  $('reviewText').textContent = sections.map(([name,items]) => `## ${name} (${items.length})\n${items.join('\n') || t('（无）')}`).join('\n\n');
  $('downloadActions').disabled = !exportRows.length;
  const changed = [];
  for (const g of groups) {
    if (g.rename) continue;
    const proposedKey = g.suggest.target;
    const proposed = proposedKey ? label(proposedKey) : g.suggest.label;
    if (!proposed) continue;
    const units = g.units.length ? g.units : [{key:g.id,label:g.name}];
    for (const u of units) {
      const target = places.get(u.key);
      if (!target) continue;
      const chosen = label(target);
      if (proposedKey ? target !== proposedKey : chosen !== proposed) changed.push({g,u,proposed,chosen});
    }
  }
  $('correctionRows').innerHTML=changed.map(({g,u,proposed,chosen})=>`<div class="correction-row" data-node-name="${esc(g.node.name)}" data-group-name="${esc(g.name)}" data-unit-name="${esc(u.label)}"><strong>${esc(g.name)} · ${esc(u.label)}</strong><label>${t('这是什么')} <input data-correction="what" aria-label="${esc(t('{name}：这是什么',{name:u.label}))}"></label><label>${t('建议去向')} <input data-correction="proposed" value="${esc(proposed)}"></label><label>${t('已选去向')} <input data-correction="chosen" value="${esc(chosen)}"></label></div>`).join('') || `<p>${t('目前没有与建议不同的改选项。')}</p>`;
  $('downloadCorrections').disabled=!changed.length;
  $('review').showModal();
}
function download(name,text,type) {
  const href = URL.createObjectURL(new Blob([text],{type}));
  const a = document.createElement('a'); a.href = href; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(href),1000);
}
function tsv(value) {
  return /[\t\r\n"]/.test(value) ? '"' + value.replace(/"/g,'""') + '"' : value;
}
$('reviewButton').addEventListener('click',showReview);
$('undoButton').addEventListener('click',()=>{if(undoStack.length) restore(undoStack.pop(),redoStack);});
$('redoButton').addEventListener('click',()=>{if(redoStack.length) restore(redoStack.pop(),undoStack);});
$('downloadReview').addEventListener('click',() => download('tidy-file-tree-review.md','# TidyFileTree · '+t('核对整理计划')+'\n\n'+$('reviewText').textContent,'text/markdown;charset=utf-8'));
$('downloadActions').addEventListener('click',() => {
  if (exportRows.length) download('tidy-file-tree-actions.tsv','op\tsrc\tdst\treason\n'+exportRows.map(row => row.map(tsv).join('\t')).join('\n')+'\n','text/tab-separated-values;charset=utf-8');
});
$('submitActions').addEventListener('click',async () => {
  if (!LIVE || !exportRows.length) return;
  const button = $('submitActions');
  const status = $('submitStatus');
  button.disabled = true;
  status.hidden = false;
  status.textContent = t('正在保存动作表…');
  try {
    const response = await fetch('workbench-actions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(exportRows),
    });
    if (!response.ok) throw new Error('Could not save the draft');
    status.textContent = t('已提交预演请求。你可以回到进度页。');
  } catch (_) {
    status.textContent = t('提交失败。检查进度页是否仍在运行，也可以下载动作表。');
  } finally {
    button.disabled = !exportRows.length;
  }
});
$('downloadCorrections').addEventListener('click',()=>{
  const rows=[...$('correctionRows').querySelectorAll('.correction-row')];
  if(!rows.length) return;
  const header=['what_this_is','node','group','unit','proposed_destination_label','chosen_destination_label'];
  const body=rows.map(row=>[row.querySelector('[data-correction="what"]').value,row.dataset.nodeName,row.dataset.groupName,row.dataset.unitName,row.querySelector('[data-correction="proposed"]').value,row.querySelector('[data-correction="chosen"]').value]);
  // Treat free-form labels and notes as text when opened in a spreadsheet.
  const content = [header,...body].map(row => row.map(value =>
    tsv(/^\s*[=+@-]/.test(value) ? "'" + value : value)).join('\t')).join('\n');
  download('tidy-file-tree-classification-corrections.tsv',content+'\n','text/tab-separated-values;charset=utf-8');
});
$('protectedButton').addEventListener('click',() => {
  const list = Array.isArray(DATA.protectedNodes) ? DATA.protectedNodes : [];
  $('protectedList').innerHTML = list.map(item => `<li><strong>${esc(item.name)}</strong>
    <div class="meta">${esc(item.path)}</div>
    <div>${esc(item.reason)}</div></li>`).join('') || `<li>${t('（无）')}</li>`;
  $('protectedDialog').showModal();
});
$('proposalsButton').addEventListener('click',() => {
  const list = Object.entries(DATA.proposedCategories);
  $('proposalList').innerHTML = list.map(([name,p]) => `<li><strong>${esc(name)}</strong>
    <div class="meta">${esc(t('{count} 组',{count:p.count}))}${p.basis ? ' · '+esc(p.basis) : ''}</div>
    <div>${esc((Array.isArray(p.members) ? p.members : []).join(' · '))}</div></li>`).join('') || `<li>${t('暂无候选类别。')}</li>`;
  $('proposals').showModal();
});
window.foState = () => ({total:unitKeys.size,linked:places.size,placements:Object.fromEntries(places)});
window.foPending = () => groups.filter(g => state(g).count < g.keys.length).map(g => ({node:g.node.name,group:g.name}));
function applyLanguage(next) {
  language = next;
  document.documentElement.lang = language;
  $('language').value = language;
  for (const element of document.querySelectorAll('[data-i18n]')) {
    element.textContent = t(element.dataset.i18n);
  }
  for (const attribute of ['aria-label','placeholder']) {
    const source = 'data-i18n-' + attribute;
    for (const element of document.querySelectorAll('[' + source + ']')) {
      element.setAttribute(attribute,t(element.getAttribute(source)));
    }
  }
  targets.get(KEEP).label = t('保持原位');
  const protList = Array.isArray(DATA.protectedNodes) ? DATA.protectedNodes : [];
  $('protectedButton').hidden = !protList.length;
  if (protList.length) $('protectedButton').textContent = t('已保护跳过 {count}', {count: protList.length});
  selectionNotice = '';
  refresh();
}
$('language').addEventListener('change', event => applyLanguage(event.target.value));
applyLanguage(language);
</script>
