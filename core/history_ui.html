function diffPaths(before, after) {
  const bDisp = relPath(before), aDisp = relPath(after);
  if (!before || !after) {
    return [renderBreadcrumbs(bDisp, 0, ''), renderBreadcrumbs(aDisp, 0, 'seg-new')];
  }
  const a = splitSegs(bDisp), b = splitSegs(aDisp);
  let i = 0;
  while (i < a.length && i < b.length) {
    const eq = isWinRoot ? a[i].toLocaleLowerCase() === b[i].toLocaleLowerCase() : a[i] === b[i];
    if (!eq) break;
    i++;
  }
  return [renderBreadcrumbs(bDisp, i, 'seg-old'), renderBreadcrumbs(aDisp, i, 'seg-new')];
}

// Precompute search haystacks and batch stats once for fast filtering even on 5,000+ operations.
for (const op of data.operations) {
  const last = current(op);
  op._last = last;
  op._hay = [op.run, op.before, op.after].filter(Boolean).join('\n').toLocaleLowerCase().replace(/\//g, '\\');
  op._seqs = new Set(op.events.map(e => String(e.seq)));
  for (const event of op.events) bySeq.set(event.seq, op);
  if (op.inverseOf) {
    if (!successors.has(op.inverseOf)) successors.set(op.inverseOf, []);
    successors.get(op.inverseOf).push(op.id);
  }
  if (!batchLatest.has(op.run) || batchLatest.get(op.run).seq < last.seq) batchLatest.set(op.run,last);
  const st = batchStats.get(op.run) ?? {count:0, moves:0, renames:0, mkdirs:0, undos:0, hasIssue:false};
  st.count++;
  if (op.direction === 'undo') st.undos++;
  if (op.kind === 'move' || op.kind === 'cross-move') st.moves++;
  else if (op.kind === 'rename') st.renames++;
  else if (op.kind === 'mkdir') st.mkdirs++;
  if (last.status === 'failed' || last.status === 'aborted' || last.status === 'pending') st.hasIssue = true;
  batchStats.set(op.run, st);
  if (op.kind === 'cross-move') crossTotal++;
  for (const p of op.parents ?? []) uniqueParents.add(p);
  totals[last.status === 'done' || last.status === 'pending' ? last.status : 'otherStates']++;
}
const batches = [...batchLatest.keys()].sort((a,b) => batchLatest.get(b).seq - batchLatest.get(a).seq);
const issueBatchCount = batches.filter(r => batchStats.get(r).hasIssue).length;
selectedBatch = batches[0] || '';
// Default to compact table automatically when a single view has a huge number of operations.
if (data.operations.length >= 120) viewMode = 'compact';

async function copyCmdText(cmd, btn, restoreKey) {
  try {
    await navigator.clipboard.writeText(cmd);
    btn.textContent = t('copied');
    setTimeout(() => { btn.textContent = t(restoreKey); }, 1400);
  } catch (_) {}
}

function renderBatchStrip(matchCountsByRun) {
  if (preview || !batches.length) { $('batchPanel').hidden = true; return; }
  $('batchPanel').hidden = false;
  $('batchPanelTitle').textContent = t('batchPanelTitle', {count: batches.length});
  $('issueBatchesBtn').hidden = !issueBatchCount;
  if (issueBatchCount) {
    $('issueBatchesBtn').textContent = t(onlyIssueBatches ? 'showAllBatches' : 'onlyIssueBatches', {count: issueBatchCount});
  }
  const hasSearch = Boolean($('search').value.trim());
  let runs = onlyIssueBatches ? batches.filter(r => batchStats.get(r).hasIssue) : batches;
  if (hasSearch && matchCountsByRun) {
    const matching = runs.filter(r => matchCountsByRun.has(r));
    if (matching.length) runs = matching;
  }
  if (selectedBatch !== ALL_BATCHES && runs.length && !runs.includes(selectedBatch)) selectedBatch = runs[0];

  // Quick jump dropdown when there are many batches (> 6)
  const jumpEl = $('batchJump');
  jumpEl.hidden = batches.length <= 6;
  if (!jumpEl.hidden) {
    jumpEl.innerHTML = `<option value="${ALL_BATCHES}">${esc(t('allBatches'))} (${data.operations.length})</option>` +
      batches.map(run => {
        const s = batchStats.get(run);
        const hits = hasSearch && matchCountsByRun?.get(run) ? ` · ${t('hits',{count:matchCountsByRun.get(run)})}` : '';
        return `<option value="${esc(run)}">${esc(shortTime(batchLatest.get(run).time))} · ${esc(t('batchItems',{count:s.count}))}${esc(hits)}</option>`;
      }).join('');
    jumpEl.value = selectedBatch;
  }

  // Cap rendered horizontal cards to keep DOM lightweight even with 100+ historical batches (keep selected visible)
  const MAX_STRIP = 18;
  let visibleRuns = runs.slice(0, MAX_STRIP);
  if (selectedBatch !== ALL_BATCHES && runs.includes(selectedBatch) && !visibleRuns.includes(selectedBatch)) {
    visibleRuns = [selectedBatch, ...visibleRuns.slice(0, MAX_STRIP - 1)];
  }
  const allCard = batches.length > 1
    ? `<button type="button" class="batch-card all-batch-card" data-batch="${ALL_BATCHES}" aria-pressed="${selectedBatch === ALL_BATCHES}">
        <div class="batch-card-top"><span>${esc(t('allBatches'))}</span><span class="tag">${data.operations.length}</span></div>
        <div class="batch-card-meta"><span>${esc(t('allBatchesMeta'))}</span></div>
      </button>` : '';
  $('batchStrip').innerHTML = allCard + visibleRuns.map(run => {
    const s = batchStats.get(run);
    const isUndoRun = s.undos > 0 && s.undos === s.count;
    const badgeCls = s.hasIssue ? 'tag pending' : isUndoRun ? 'tag undo-badge' : 'tag done';
    const badgeTxt = s.hasIssue ? t('batchFail') : t(isUndoRun ? 'batchUndoRun' : 'batchApply');
    const breakdown = [];
    if (s.moves) breakdown.push(`${t('move')} ${s.moves}`);
    if (s.renames) breakdown.push(`${t('rename')} ${s.renames}`);
    if (s.mkdirs) breakdown.push(`${t('mkdir')} ${s.mkdirs}`);
    const shortId = run ? (run.length > 12 ? '…' + run.slice(-8) : run) : '—';
    const hits = hasSearch && matchCountsByRun?.get(run)
      ? `<span class="hit-badge">${esc(t('hits',{count:matchCountsByRun.get(run)}))}</span>` : '';
    return `<button type="button" class="batch-card" data-batch="${esc(run)}" aria-pressed="${selectedBatch === run}">
      <div class="batch-card-top"><span>${esc(shortTime(batchLatest.get(run).time))}</span><span>${hits} <span class="${badgeCls}">${esc(badgeTxt)}</span></span></div>
      <div class="batch-card-meta"><span>${esc(breakdown.join(' · ') || t('batchItems',{count:s.count}))}</span><span class="batch-id-short" title="${esc(run)}">${esc(shortId)}</span></div>
    </button>`;
  }).join('');

  const hasSingleBatch = Boolean(selectedBatch && selectedBatch !== ALL_BATCHES && runs.includes(selectedBatch));
  $('undoDrawerBtn').hidden = !hasSingleBatch;
  $('undoDrawerBtn').textContent = t(undoDrawerOpen ? 'undoBatchHide' : 'undoBatchBtn');
  $('undoDrawer').hidden = !hasSingleBatch || !undoDrawerOpen;
  if (hasSingleBatch) {
    const cmd = `tidy-file-tree undo --journal "${journalPath.replace(/"/g,'\\"')}" --run-id ${selectedBatch}${sysFlag} --dry-run`;
    $('cmdText').textContent = cmd;
    $('copyCmd').textContent = t('copyUndo');
    $('copyCmd').onclick = () => copyCmdText(cmd, $('copyCmd'), 'copyUndo');
  }
}

function renderFlowMap(ops, force) {
  const flowKey = `${lang}|${showFullPath}|${preview ? 'p' : selectedBatch}|${ops.length}`;
  if (!force && flowKey === lastFlowKey) {
    const activeQuery = $('search').value.trim();
    for (const g of $('flowSvg').querySelectorAll('.flow-node')) {
      g.classList.toggle('active', Boolean(activeQuery && g.getAttribute('data-filter-path') === activeQuery));
    }
    return;
  }
  lastFlowKey = flowKey;
  if (!ops.length) { $('flowCard').hidden = true; return; }
  const rawEdges = [], srcTotals = new Map(), dstTotals = new Map();
  for (const op of ops) {
    if (!op.before || !op.after) continue;
    const srcRel = relPath(parentDir(op.before)) || '.';
    const dstRel = relPath(parentDir(op.after)) || '.';
    const srcKey = splitSegs(srcRel).slice(0, 2).join('/') || '.';
    const dstKey = splitSegs(dstRel).slice(0, 2).join('/') || '.';
    rawEdges.push([srcKey, dstKey]);
    srcTotals.set(srcKey, (srcTotals.get(srcKey) || 0) + 1);
    dstTotals.set(dstKey, (dstTotals.get(dstKey) || 0) + 1);
  }
  if (!rawEdges.length) { $('flowCard').hidden = true; return; }

  // Cap at Top 6 sources & Top 6 destinations, aggregating remaining folders into a clean "other folders" node.
  const MAX_NODES = 6;
  const topSrcs = [...srcTotals.entries()].sort((a,b) => b[1] - a[1]);
  const topDsts = [...dstTotals.entries()].sort((a,b) => b[1] - a[1]);
  const keepSrc = new Set(topSrcs.slice(0, MAX_NODES).map(e => e[0]));
  const keepDst = new Set(topDsts.slice(0, MAX_NODES).map(e => e[0]));
  const otherSrcCount = Math.max(0, topSrcs.length - MAX_NODES);
  const otherDstCount = Math.max(0, topDsts.length - MAX_NODES);
  const OTHER_SRC = '__OTHER_SRC__', OTHER_DST = '__OTHER_DST__';

  const edgeCounts = new Map(), aggSrc = new Map(), aggDst = new Map();
  for (const [s0, d0] of rawEdges) {
    const s = keepSrc.has(s0) ? s0 : OTHER_SRC;
    const d = keepDst.has(d0) ? d0 : OTHER_DST;
    const key = s + '\0' + d;
    edgeCounts.set(key, (edgeCounts.get(key) || 0) + 1);
    aggSrc.set(s, (aggSrc.get(s) || 0) + 1);
    aggDst.set(d, (aggDst.get(d) || 0) + 1);
  }
  const srcs = [...aggSrc.entries()].sort((a,b) => (a[0] === OTHER_SRC) - (b[0] === OTHER_SRC) || b[1] - a[1]);
  const dsts = [...aggDst.entries()].sort((a,b) => (a[0] === OTHER_DST) - (b[0] === OTHER_DST) || b[1] - a[1]);

  $('flowCard').hidden = false;
  $('flowTitle').textContent = t('flowTitle');
  $('flowHint').textContent = t('flowHint');
  $('flowToggleBtn').textContent = t(flowCollapsed ? 'flowShow' : 'flowHide');
  $('flowSvg').hidden = flowCollapsed;
  if (flowCollapsed) return;
  const activeQuery = $('search').value.trim();
  const rowH = 30, gap = 7, boxW = 280, w = 860;
  const h = Math.max(srcs.length, dsts.length) * (rowH + gap) + 6;
  const svgEl = $('flowSvg');
  svgEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const frag = document.createDocumentFragment();
  const sPos = new Map(), dPos = new Map();
  const trim = s => s.length > 28 ? '…' + s.slice(-26) : s;
  const mk = (tag, attrs) => {
    const el = document.createElementNS(svgNS, tag);
    for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  };
  srcs.forEach(([name, cnt], i) => {
    const y = i * (rowH + gap) + 3;
    sPos.set(name, y + rowH / 2);
    const isOther = name === OTHER_SRC;
    const labelTxt = isOther ? t('otherFolders', {count: otherSrcCount}) : trim(name);
    const g = mk('g', {class:'flow-node' + (isOther ? ' is-other' : '') + (!isOther && activeQuery === name ? ' active' : ''), ...(isOther ? {} : {'data-filter-path': name})});
    g.append(mk('rect', {x:0, y, width:boxW, height:rowH, rx:7}));
    const txt = mk('text', {x:12, y:y + 19});
    txt.textContent = labelTxt;
    const num = mk('text', {x:boxW - 12, y:y + 19, 'text-anchor':'end', class:'flow-cnt'});
    num.textContent = String(cnt);
    g.append(txt, num);
    frag.append(g);
  });
  dsts.forEach(([name, cnt], i) => {
    const y = i * (rowH + gap) + 3;
    dPos.set(name, y + rowH / 2);
    const x = w - boxW;
    const isOther = name === OTHER_DST;
    const labelTxt = isOther ? t('otherFolders', {count: otherDstCount}) : trim(name);
    const g = mk('g', {class:'flow-node' + (isOther ? ' is-other' : '') + (!isOther && activeQuery === name ? ' active' : ''), ...(isOther ? {} : {'data-filter-path': name})});
    g.append(mk('rect', {x, y, width:boxW, height:rowH, rx:7}));
    const txt = mk('text', {x:x + 12, y:y + 19});
    txt.textContent = labelTxt;
    const num = mk('text', {x:w - 12, y:y + 19, 'text-anchor':'end', class:'flow-cnt'});
    num.textContent = String(cnt);
    g.append(txt, num);
    frag.append(g);
  });
  const maxCnt = Math.max(...edgeCounts.values());
  for (const [key, cnt] of edgeCounts) {
    const [s, d] = key.split('\0');
    const y1 = sPos.get(s), y2 = dPos.get(d);
    const x1 = boxW, x2 = w - boxW, mid = w / 2;
    const sw = 2 + (cnt / maxCnt) * 7;
    const path = mk('path', {d:`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`, class:'flow-edge', 'stroke-width':sw.toFixed(1)});
    const tip = mk('title', {});
    const sLabel = s === OTHER_SRC ? t('otherFolders',{count:otherSrcCount}) : s;
    const dLabel = d === OTHER_DST ? t('otherFolders',{count:otherDstCount}) : d;
    tip.textContent = `${sLabel} → ${dLabel} (${cnt})`;
    path.append(tip);
    frag.append(path);
  }
  svgEl.replaceChildren(frag);
}

function operationCard(op) {
  const last = op._last;
  const kind = t(op.kind);
  const heading = preview ? `#${op.id} · ${kind}` : op.direction ? t(op.direction) + ' · ' + kind : kind;
  const [beforeHtml, afterHtml] = diffPaths(op.before, op.after);
  let route = '';
  if (!op.before && op.after) {
    route = `<div class="route single"><dl title="${esc(op.after)}"><dt>${t(op.kind === 'mkdir' ? 'mkdirPath' : (preview ? 'previewTo' : 'to'))}</dt><dd>${afterHtml}</dd></dl></div>`;
  } else if (op.before || op.after) {
    route = `<div class="route"><dl title="${esc(op.before || '')}"><dt>${t(preview ? 'previewFrom' : 'from')}</dt><dd>${beforeHtml}</dd></dl><span class="arrow" aria-hidden="true">→</span><dl title="${esc(op.after || '')}"><dt>${t(preview ? 'previewTo' : 'to')}</dt><dd>${afterHtml}</dd></dl></div>`;
  }
  const parents = op.parents?.length ? `<div class="parents muted">${t('parents')} · ${op.parents.map(p => esc(relPath(p))).join(' · ')}</div>` : '';
  const laterSeqs = op.events.flatMap(event => successors.get(event.seq) || []);
  const wasUndone = laterSeqs.length > 0 && op.direction !== 'undo';
  const crossTag = op.kind === 'cross-move' ? `<span class="tag cross">${t('cross-move')}</span>` : '';
  const inverseTags = [];
  if (op.inverseOf) inverseTags.push(`<button type="button" class="tag-link" data-seq="${op.inverseOf}">${esc(t('original',{seq:op.inverseOf}))}</button>`);
  for (const seq of laterSeqs) inverseTags.push(`<button type="button" class="tag-link" data-seq="${seq}">${esc(t(wasUndone ? 'undoneBy' : 'related',{seq}))}</button>`);

  let footerHtml = '';
  if (op.events.length) {
    const abnormal = last.status !== 'done' || op.events.some(e => e.recovered);
    const seqSpan = op.events.length > 1 ? `#${op.events[0].seq} → #${last.seq}` : `#${last.seq}`;
    const eventsOl = `<ol class="steps">${op.events.map(event => `<li class="${event.status}"><strong>${t(event.status === 'pending' ? 'prepared' : event.status)} · #${event.seq}</strong><time>${esc(time(event.time))}</time>${event.recovered ? ' · ' + t('recover') : ''}</li>`).join('')}</ol>`;
    const canUndoSingle = !preview && last.status === 'done' && !wasUndone && op.kind !== 'note';
    const undoBtn = canUndoSingle ? `<button type="button" class="op-mini-btn" data-copy-seq="${last.seq}">${esc(t('copySingleUndo'))}</button>` : '';
    const batchNote = selectedBatch === ALL_BATCHES && op.run ? `<span class="batch-id-short" title="${esc(op.run)}">…${esc(op.run.slice(-8))}</span>` : '';
    if (abnormal) {
      footerHtml = eventsOl;
    } else {
      footerHtml = `<div class="op-foot">
        <div class="op-foot-left"><span>${esc(shortTime(last.time))}</span><span>·</span><span>${esc(seqSpan)}</span>${batchNote}</div>
        <div class="op-foot-actions">${undoBtn}</div>
      </div>
      <details class="steps-details"><summary>${esc(t('stepDetails'))}</summary>${eventsOl}</details>`;
    }
  }
  const cardCls = `operation kind-${esc(op.kind)}${op.direction ? ' dir-' + esc(op.direction) : ''}${wasUndone ? ' was-undone' : ''}`;
  return `<article class="${cardCls}" id="operation-${op.id}" tabindex="-1">
    <div class="op-head"><h3>${heading}</h3><div class="tag-group">${inverseTags.join('')}${crossTag}<span class="tag ${last.status}">${t(data.receiptBlocked ? 'eligible' : last.status)}</span></div></div>
    ${route}${parents}${footerHtml}</article>`;
}

function compactRow(op) {
  const last = op._last;
  const kind = op.direction ? `${t(op.direction)}·${t(op.kind)}` : t(op.kind);
  const laterSeqs = op.events.flatMap(event => successors.get(event.seq) || []);
  const wasUndone = laterSeqs.length > 0 && op.direction !== 'undo';
  const linkBtns = [
    ...(op.inverseOf ? [`<button type="button" class="tag-link" data-seq="${op.inverseOf}">#${op.inverseOf}</button>`] : []),
    ...laterSeqs.map(seq => `<button type="button" class="tag-link" data-seq="${seq}">${esc(t(wasUndone ? 'undoneBy' : 'related',{seq}))}</button>`),
  ].join(' ');
  const seqLabel = preview ? `#${op.id}` : `#${last.seq}`;
  const timeCell = preview ? seqLabel : `${esc(shortTime(last.time))} · ${seqLabel}`;
  const canUndoSingle = !preview && last.status === 'done' && !wasUndone && op.kind !== 'note';
  const undoBtn = canUndoSingle ? ` <button type="button" class="op-mini-btn" data-copy-seq="${last.seq}">${esc(t('copySingleUndo'))}</button>` : '';
  return `<tr id="operation-${op.id}" tabindex="-1" class="${wasUndone ? 'was-undone' : ''}">
    <td><strong>${esc(kind)}</strong></td>
    <td class="compact-path" title="${esc(op.before || '')}">${esc(relPath(op.before) || '—')}</td>
    <td class="compact-path" title="${esc(op.after || '')}">${esc(relPath(op.after) || '—')}</td>
    <td class="muted" style="white-space:nowrap">${timeCell}</td>
    <td><span class="tag ${last.status}">${t(data.receiptBlocked ? 'eligible' : last.status)}</span> ${linkBtns}${undoBtn}</td>
  </tr>`;
}

function renderGroupBody(dest, list) {
  const limit = groupRenderLimit.get(dest) ?? 20;
  const slice = list.slice(0, limit);
  const left = list.length - slice.length;
  const moreBtn = left > 0
    ? `<button type="button" class="load-more-btn" data-load-group="${esc(dest)}">${esc(t('loadMore', {count: Math.min(50, left), left}))}</button>` : '';
  return slice.map(operationCard).join('') + moreBtn;
}

function render(jump) {
  const query = $('search').value.trim().toLocaleLowerCase();
  const normQuery = query.replace(/\//g, '\\');
  const numQuery = query.replace(/^#/, '');
  const status = preview ? 'all' : $('status').value;
  const kindFilter = $('kind').value;
  const matches = [];
  const matchCountsByRun = new Map();
  for (const op of data.operations) {
    const st = op._last.status;
    if (status !== 'all' && (status === 'other' ? knownStatuses.has(st) : st !== status)) continue;
    if (kindFilter !== 'all' && op.kind !== kindFilter) continue;
    if (query && !op._hay.includes(normQuery) && !(preview ? String(op.id) === numQuery : op._seqs.has(numQuery))) continue;
    matches.push(op);
    matchCountsByRun.set(op.run, (matchCountsByRun.get(op.run) || 0) + 1);
  }
  if (jump && !preview) selectedBatch = jump.run;
  renderBatchStrip(matchCountsByRun);
  const batchOps = preview || selectedBatch === ALL_BATCHES
    ? data.operations
    : data.operations.filter(op => op.run === selectedBatch);
  renderFlowMap(batchOps, false);

  const entries = preview || selectedBatch === ALL_BATCHES
    ? matches
    : matches.filter(op => op.run === selectedBatch);
  $('result').textContent = entries.length
    ? t(preview ? (data.receiptBlocked ? 'eligibleResult' : 'previewResult') : (selectedBatch === ALL_BATCHES ? 'resultAll' : 'result'), {count: entries.length})
    : t(data.operations.length ? 'noMatch' : preview ? 'previewEmpty' : 'empty');
  $('pathModeBtn').textContent = t(showFullPath ? 'pathFull' : 'pathRel');
  for (const b of $('viewToggle').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.view === viewMode));
  for (const statEl of $('summary').querySelectorAll('[data-stat-filter]')) {
    statEl.classList.toggle('active-stat', !preview && $('status').value === statEl.dataset.statFilter);
  }

  $('toggleGroupsBtn').hidden = viewMode !== 'grouped' || !entries.length;
  $('pageSizeSelect').hidden = viewMode === 'grouped' || !entries.length;

  if (viewMode === 'grouped' && entries.length) {
    groupedData = new Map();
    groupRenderLimit.clear();
    for (const op of entries) {
      const destRaw = op.kind === 'mkdir' ? (op.after || t('noDest')) : (parentDir(op.after) || t('noDest'));
      const dest = relPath(destRaw) || destRaw;
      if (!groupedData.has(dest)) groupedData.set(dest, []);
      groupedData.get(dest).push(op);
    }
    const autoOpenAll = entries.length <= 30 && groupedData.size <= 8;
    let idx = 0;
    $('operations').innerHTML = [...groupedData.entries()].map(([dest, list]) => {
      const open = autoOpenAll || idx === 0 || (jump && list.includes(jump));
      idx++;
      return `<details class="dest-group" data-dest-group="${esc(dest)}"${open ? ' open' : ''}>
        <summary><span>${esc(dest)}</span><span class="tag">${esc(t('groupCount',{count:list.length}))}</span></summary>
        <div class="dest-group-body">${open ? renderGroupBody(dest, list) : ''}</div>
      </details>`;
    }).join('');
    $('toggleGroupsBtn').textContent = t(autoOpenAll ? 'collapseAllGroups' : 'expandAllGroups');
    $('pages').hidden = true;
    if (jump) $(`operation-${jump.id}`)?.focus();
    return;
  }

  const numPages = Math.max(1, Math.ceil(entries.length / pageSize));
  if (jump) page = Math.max(0, Math.floor(entries.indexOf(jump) / pageSize));
  page = Math.max(0, Math.min(page, numPages - 1));
  const slice = entries.slice(page * pageSize, (page + 1) * pageSize);

  if (viewMode === 'compact' && slice.length) {
    $('operations').innerHTML = `<div class="compact-table-wrap"><table class="compact-table">
      <thead><tr><th>${t('colOp')}</th><th>${t('colFrom')}</th><th>${t('colTo')}</th><th>${t('colTime')}</th><th>${t('colState')}</th></tr></thead>
      <tbody>${slice.map(compactRow).join('')}</tbody></table></div>`;
  } else {
    $('operations').innerHTML = slice.map(operationCard).join('');
  }
  $('pages').hidden = numPages === 1;
  $('pageInput').max = String(numPages);
  $('pageInput').value = String(page + 1);
  $('pageTotal').textContent = `/ ${numPages}`;
  $('firstPage').disabled = $('previous').disabled = page === 0;
  $('next').disabled = $('lastPage').disabled = page + 1 >= numPages;
  if (jump) $(`operation-${jump.id}`)?.focus();
}

function applyLanguage(next) {
  lang = next;
  document.documentElement.lang = lang;
  $('language').value = lang;
  for (const id of ['searchLabel','kindLabel','statusLabel','firstPage','previous','next','lastPage','viewList','viewCompact','viewGrouped']) $(id).textContent = t(id);
  for (const opt of $('pageSizeSelect').options) opt.textContent = t('perPage', {n: opt.value});
  document.title = $('title').textContent = t(preview ? 'previewTitle' : 'title');
  $('root').textContent = data.root;
  $('search').placeholder = t(preview ? 'previewHint' : 'searchHint');
  const prevKind = $('kind').value || 'all';
  $('kind').innerHTML = ['all','move','cross-move','rename','mkdir'].map(key => `<option value="${key}">${t(key === 'all' ? 'allKinds' : key)}</option>`).join('');
  $('kind').value = prevKind;
  const prevStatus = $('status').value || 'all';
  $('status').innerHTML = ['all','done','pending','aborted','failed','other'].map(key => `<option value="${key}">${t(key)}</option>`).join('');
  $('status').value = prevStatus;
  const summaryCards = preview
    ? [
        [data.receiptBlocked ? 'eligible' : 'ready', data.operations.length, data.receiptBlocked ? '' : 'tone-good', ''],
        ['blocked', data.blocked.length, data.blocked.length ? 'tone-danger' : '', ''],
        ...(crossTotal ? [['crossCount', crossTotal, 'tone-warn', '']] : []),
        ...(uniqueParents.size ? [['newDirs', uniqueParents.size, '', '']] : []),
      ]
    : [
        ['batches', batches.length, '', 'all'],
        ['done', totals.done, 'tone-good', 'done'],
        ['pending', totals.pending, totals.pending ? 'tone-warn' : '', 'pending'],
        ['otherStates', totals.otherStates, totals.otherStates ? 'tone-warn' : '', 'other'],
      ];
  $('summary').innerHTML = summaryCards.map(([key,value,tone,filterKey]) =>
    `<div class="${tone}${filterKey ? ' clickable' : ''}"${filterKey ? ` data-stat-filter="${filterKey}"` : ''}><dt>${t(key)}</dt><dd>${value}</dd></div>`
  ).join('');
  $('mirror').textContent = t('mirror');
  $('mirror').hidden = !data.mirrorDiffers;
  $('hidden').textContent = t('hidden',{count:data.hidden ?? 0});
  $('hidden').hidden = !data.hidden;
  $('snapshot').textContent = t(preview ? 'previewSnapshot' : 'snapshot',{time:time(data.captured)});
  if (preview) {
    $('filters').classList.add('preview');
    $('statusWrap').hidden = true;
    $('searchLabel').textContent = t('previewSearch');
    if (data.blocked.length) {
      $('blockers').innerHTML = `<strong>${t(data.receiptBlocked ? 'blockedReceipt' : 'blockers')}</strong><ul>${data.blocked.map(message => `<li>${esc(message)}</li>`).join('')}</ul>`;
      $('blockers').hidden = false;
    }
  }
  lastFlowKey = '';
  renderAppMode();
  render();
  if (!preview && appMode === 'explorer') renderExplorer();
}

/* ==================== Time-Machine Historical File Explorer ==================== */
const isLive = Boolean(data.live && data.apiBase);
const presentMap = data.present || {};
const destMetaMap = data.destinationMeta || {};
const liveDirCache = new Map();
const liveStatCache = new Map();
const doneMoveOps = data.operations
  .filter(op => (op.kind === 'move' || op.kind === 'cross-move' || op.kind === 'rename') && op.before && op.after && op._last?.status === 'done')
  .sort((a, b) => a._last.seq - b._last.seq);
const doneMkdirOps = data.operations
  .filter(op => op.kind === 'mkdir' && op.after && op._last?.status === 'done')
  .sort((a, b) => a._last.seq - b._last.seq);

let appMode = (!preview && doneMoveOps.length > 0) ? 'explorer' : 'journal';
let expCutoffSeq = 0;
let expCurDir = '';
let expNavStack = [];
let expSelectedKey = '';
let expSearchQuery = '';
let expOnlyChanged = false;
let expSearchTimer = 0;
let expRevealStatus = null;
let expState = null;

function normCmp(p) {
  if (!p) return '';
  let s = String(p).replace(/\//g, '\\').replace(/\\+$/, '');
  if (isWinRoot) s = s.toLocaleLowerCase();
  return s;
}
function joinPath(base, leaf) {
  const sep = isWinRoot ? '\\' : '/';
  const b = String(base || '').replace(/[\\/]+$/, '');
  const l = String(leaf || '').replace(/^[\\/]+/, '');
  return b ? (l ? b + sep + l : b) : l;
}
function toAbsPath(raw) {
  if (!raw) return rootTrim;
  if (/^(?:[A-Za-z]:[\\/]|\\\\|\/)/.test(raw)) return raw;
  return joinPath(rootTrim, raw);
}
function toRelPosix(absPath) {
  const cmpRoot = normCmp(rootTrim);
  const cmpVal = normCmp(absPath);
  if (cmpVal === cmpRoot) return '';
  if (cmpVal.startsWith(cmpRoot + '\\')) {
    return absPath.slice(rootTrim.length + 1).replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
  }
  return null;
}
function parentRelPosix(rel) {
  if (!rel) return null;
  const idx = rel.lastIndexOf('/');
  return idx === -1 ? '' : rel.slice(0, idx);
}
function leafName(p) {
  const segs = splitSegs(p);
  return segs.length ? segs[segs.length - 1] : p;
}
function formatBytes(n) {
  if (!n || n <= 0) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let v = n, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v >= 100 ? 0 : 1)) + ' ' + units[i];
}
function lookupMeta(absPath) {
  const rel = toRelPosix(absPath);
  if (destMetaMap[absPath]) return destMetaMap[absPath];
  if (rel && destMetaMap[rel]) return destMetaMap[rel];
  if (rel && destMetaMap[rel.replace(/\//g, '\\')]) return destMetaMap[rel.replace(/\//g, '\\')];
  const cmp = normCmp(absPath);
  for (const [k, v] of Object.entries(destMetaMap)) {
    if (normCmp(toAbsPath(k)) === cmp) return v;
  }
  return null;
}
function presentEntriesFor(absDir) {
  const k = normCmp(absDir);
  if (liveDirCache.has(k)) return liveDirCache.get(k);
  const rel = toRelPosix(absDir);
  if (rel !== null) {
    const pKey = rel === '' ? '.' : rel;
    if (Array.isArray(presentMap[pKey])) return presentMap[pKey];
  }
  return null;
}

function buildTimepointOptions() {
  const opts = [{seq: 0, label: t('expBeforeAll')}];
  // Compute each batch's earliest done move/rename seq so the user can view state right before any batch.
  const batchFirst = new Map();
  for (const op of doneMoveOps) {
    const seq = op._last.seq;
    const prev = batchFirst.get(op.run);
    if (!prev || seq < prev.seq) batchFirst.set(op.run, {seq, time: op._last.time, count: 0});
    batchFirst.get(op.run).count++;
  }
  const ordered = [...batchFirst.entries()].sort((a, b) => a[1].seq - b[1].seq);
  for (let i = 1; i < ordered.length; i++) {
    const [, info] = ordered[i];
    opts.push({seq: info.seq - 1, label: t('expBeforeBatch', {time: shortTime(info.time), count: info.count})});
  }
  return opts;
}

function classifyChange(pathAtT, currentPath, steps) {
  if (!steps.length) return 'unchanged';
  if (normCmp(pathAtT) === normCmp(currentPath)) return 'undone';
  if (steps.some(s => s.kind === 'cross-move') && toRelPosix(currentPath) === null) return 'cross-move';
  if (normCmp(parentDir(pathAtT)) === normCmp(parentDir(currentPath))) return 'rename';
  return 'move';
}

function buildTimeMachine(cutoffSeq) {
  const futureOps = doneMoveOps.filter(op => op._last.seq > cutoffSeq);
  const futureMkdirs = doneMkdirOps.filter(op => op._last.seq > cutoffSeq);
  const createdAfterT = new Set(futureMkdirs.map(op => normCmp(toAbsPath(op.after))));
  const tracked = [];

  for (const op of futureOps) {
    const befAbs = toAbsPath(op.before);
    const aftAbs = toAbsPath(op.after);
    const befCmp = normCmp(befAbs);
    const stepBase = {
      seq: op._last.seq,
      time: op._last.time,
      run: op.run,
      kind: op.kind,
      direction: op.direction,
      opBefore: befAbs,
      opAfter: aftAbs,
    };

    let matchedExact = false;
    let matchedChildOf = null;
    for (const item of tracked) {
      const curCmp = normCmp(item.currentPath);
      if (curCmp === befCmp) {
        item.steps.push({...stepBase, from: item.currentPath, to: aftAbs, inherited: false});
        item.currentPath = aftAbs;
        matchedExact = true;
      } else if (curCmp.startsWith(befCmp + '\\')) {
        const suffix = item.currentPath.slice(befAbs.replace(/[\\/]+$/, '').length + 1);
        const next = joinPath(aftAbs, suffix);
        item.steps.push({...stepBase, from: item.currentPath, to: next, inherited: true});
        item.currentPath = next;
      } else if (befCmp.startsWith(curCmp + '\\') && !matchedChildOf) {
        matchedChildOf = item;
      }
    }

    if (!matchedExact) {
      if (matchedChildOf) {
        const suffix = befAbs.slice(matchedChildOf.currentPath.replace(/[\\/]+$/, '').length + 1);
        const pathAtT = joinPath(matchedChildOf.pathAtT, suffix);
        const priorSteps = matchedChildOf.steps.map(st => ({
          ...st,
          from: joinPath(st.from, suffix),
          to: joinPath(st.to, suffix),
          inherited: true,
        }));
        priorSteps.push({...stepBase, from: befAbs, to: aftAbs, inherited: false});
        tracked.push({pathAtT, currentPath: aftAbs, steps: priorSteps});
      } else {
        tracked.push({
          pathAtT: befAbs,
          currentPath: aftAbs,
          steps: [{...stepBase, from: befAbs, to: aftAbs, inherited: false}],
        });
      }
    }
  }

  // Enrich tracked items with relative paths, folder detection, and current disk meta.
  const byRelAtT = new Map();
  const arrivedAfterT = new Set();
  const folderChangeCounts = new Map();
  const virtualFolders = new Set(['']);

  for (const item of tracked) {
    item.relAtT = toRelPosix(item.pathAtT);
    item.currentRel = toRelPosix(item.currentPath);
    item.status = classifyChange(item.pathAtT, item.currentPath, item.steps);
    item.lastSeq = item.steps.length ? item.steps[item.steps.length - 1].seq : null;
    const metaInfo = lookupMeta(item.currentPath) || lookupMeta(item.pathAtT);
    item.existsNow = metaInfo ? metaInfo.exists : null;
    item.size = metaInfo ? (metaInfo.size || 0) : 0;
    item.isDir = Boolean(metaInfo?.isDir) || (item.currentRel !== null && presentMap[item.currentRel || '.'] !== undefined);
    arrivedAfterT.add(normCmp(item.currentPath));
    if (item.relAtT !== null) {
      byRelAtT.set(normCmp(item.relAtT), item);
      let p = parentRelPosix(item.relAtT);
      while (p !== null) {
        virtualFolders.add(p);
        if (item.status !== 'unchanged') {
          folderChangeCounts.set(p, (folderChangeCounts.get(p) || 0) + 1);
        }
        p = parentRelPosix(p);
      }
    }
  }
  // If any tracked item is a strict ancestor of another tracked item's pathAtT, it's definitely a folder.
  for (const item of tracked) {
    if (!item.isDir && item.relAtT !== null && virtualFolders.has(item.relAtT)) item.isDir = true;
  }

  return {cutoffSeq, tracked, byRelAtT, arrivedAfterT, createdAfterT, folderChangeCounts, virtualFolders};
}

function findMovedAncestor(relDir, st) {
  if (!relDir) return null;
  let cur = relDir;
  while (cur) {
    const hit = st.byRelAtT.get(normCmp(cur));
    if (hit && hit.status !== 'unchanged') {
      const suffix = cur === relDir ? '' : relDir.slice(cur.length + 1);
      return {ancestor: hit, mappedAbs: suffix ? joinPath(hit.currentPath, suffix) : hit.currentPath};
    }
    cur = parentRelPosix(cur);
  }
  return null;
}

function traceCustomQuery(rawQuery, st) {
  const q = rawQuery.trim();
  if (!q || (!q.includes('\\') && !q.includes('/'))) return null;
  const origAbs = toAbsPath(q);
  const futureOps = doneMoveOps.filter(op => op._last.seq > st.cutoffSeq);
  let cur = origAbs;
  const steps = [];
  for (const op of futureOps) {
    const befAbs = toAbsPath(op.before);
    const aftAbs = toAbsPath(op.after);
    const curCmp = normCmp(cur);
    const befCmp = normCmp(befAbs);
    if (curCmp === befCmp) {
      steps.push({seq: op._last.seq, time: op._last.time, run: op.run, kind: op.kind, direction: op.direction, from: cur, to: aftAbs, opBefore: befAbs, opAfter: aftAbs, inherited: false});
      cur = aftAbs;
    } else if (curCmp.startsWith(befCmp + '\\')) {
      const suffix = cur.slice(befAbs.replace(/[\\/]+$/, '').length + 1);
      const next = joinPath(aftAbs, suffix);
      steps.push({seq: op._last.seq, time: op._last.time, run: op.run, kind: op.kind, direction: op.direction, from: cur, to: next, opBefore: befAbs, opAfter: aftAbs, inherited: true});
      cur = next;
    }
  }
  if (!steps.length) return null;
  const relAtT = toRelPosix(origAbs);
  const metaInfo = lookupMeta(cur);
  return {
    key: 'trace:' + normCmp(origAbs),
    name: leafName(origAbs),
    relAtT: relAtT ?? origAbs,
    pathAtT: origAbs,
    currentPath: cur,
    currentRel: toRelPosix(cur),
    status: classifyChange(origAbs, cur, steps),
    steps,
    isDir: Boolean(metaInfo?.isDir),
    size: metaInfo ? (metaInfo.size || 0) : 0,
    existsNow: metaInfo ? metaInfo.exists : null,
    lastSeq: steps[steps.length - 1].seq,
    isTraceHit: true,
  };
}

function getExplorerEntries(dirRel, st) {
  const entries = [];
  const seen = new Set();
  const movedAnc = findMovedAncestor(dirRel, st);
  const physicalDirAbs = movedAnc ? movedAnc.mappedAbs : (dirRel ? joinPath(rootTrim, dirRel) : rootTrim);
  const add = item => {
    const k = normCmp(item.name);
    if (seen.has(k)) return;
    seen.add(k);
    entries.push(item);
  };

  // 1. Direct tracked items whose historical parent at timepoint T is dirRel.
  for (const item of st.tracked) {
    if (item.relAtT === null) continue;
    if (parentRelPosix(item.relAtT) === dirRel) {
      add({
        key: 'rel:' + normCmp(item.relAtT),
        name: leafName(item.relAtT),
        relAtT: item.relAtT,
        pathAtT: item.pathAtT,
        currentPath: item.currentPath,
        currentRel: item.currentRel,
        status: item.status,
        steps: item.steps,
        isDir: item.isDir,
        size: item.size,
        existsNow: item.existsNow,
        lastSeq: item.lastSeq,
      });
    }
  }

  // 2. Virtual intermediate folders needed to reach deeper tracked items (in case an emptied folder was deleted).
  const prefix = dirRel ? dirRel + '/' : '';
  for (const vf of st.virtualFolders) {
    if (!vf || vf === dirRel) continue;
    if (prefix && !vf.startsWith(prefix)) continue;
    const rest = prefix ? vf.slice(prefix.length) : vf;
    const childName = rest.split('/')[0];
    if (!childName || seen.has(normCmp(childName))) continue;
    const childRel = prefix + childName;
    const childAbs = joinPath(rootTrim, childRel);
    const mapped = movedAnc ? joinPath(movedAnc.mappedAbs, childName) : childAbs;
    add({
      key: 'rel:' + normCmp(childRel),
      name: childName,
      relAtT: childRel,
      pathAtT: childAbs,
      currentPath: mapped,
      currentRel: toRelPosix(mapped),
      status: movedAnc ? movedAnc.ancestor.status : 'unchanged',
      steps: movedAnc ? movedAnc.ancestor.steps.map(s => ({...s, inherited: true})) : [],
      isDir: true,
      size: 0,
      existsNow: null,
      lastSeq: movedAnc ? movedAnc.ancestor.lastSeq : null,
      changeCount: st.folderChangeCounts.get(childRel) || 0,
    });
  }

  // 3. Present-day entries from the mapped physical directory (hybrid ghost + untouched overlay!).
  const present = presentEntriesFor(physicalDirAbs);
  if (Array.isArray(present)) {
    for (const [name, isDirInt, size] of present) {
      if (seen.has(normCmp(name))) continue;
      const physChildAbs = joinPath(physicalDirAbs, name);
      const childRel = prefix + name;
      const histChildAbs = joinPath(rootTrim, childRel);
      if (!movedAnc) {
        // Skip items that were moved INTO this folder AFTER timepoint T, or mkdir'd after T.
        if (st.arrivedAfterT.has(normCmp(physChildAbs))) continue;
        if (st.createdAfterT.has(normCmp(physChildAbs))) continue;
      }
      add({
        key: 'rel:' + normCmp(childRel),
        name,
        relAtT: childRel,
        pathAtT: histChildAbs,
        currentPath: physChildAbs,
        currentRel: toRelPosix(physChildAbs),
        status: movedAnc ? movedAnc.ancestor.status : 'unchanged',
        steps: movedAnc ? movedAnc.ancestor.steps.map(s => ({...s, from: joinPath(s.from, movedAnc.ancestor.relAtT ? childRel.slice(movedAnc.ancestor.relAtT.length + 1) : name), to: joinPath(s.to, movedAnc.ancestor.relAtT ? childRel.slice(movedAnc.ancestor.relAtT.length + 1) : name), inherited: true})) : [],
        isDir: Boolean(isDirInt),
        size: size || 0,
        existsNow: true,
        lastSeq: movedAnc ? movedAnc.ancestor.lastSeq : null,
        changeCount: st.folderChangeCounts.get(childRel) || 0,
      });
    }
  }

  // Sort: folders first, then changed items before unchanged, then alphabetical.
  entries.sort((a, b) => {
    if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
    const ac = a.status !== 'unchanged' ? 0 : 1;
    const bc = b.status !== 'unchanged' ? 0 : 1;
    if (ac !== bc) return ac - bc;
    return a.name.localeCompare(b.name, lang);
  });

  return {entries, movedAnc, physicalDirAbs, needsLiveFetch: isLive && present === null};
}

function searchExplorerAll(query, st) {
  const q = query.trim().toLocaleLowerCase().replace(/\//g, '\\');
  const results = [];
  const seen = new Set();

  const traced = traceCustomQuery(query, st);
  if (traced) {
    results.push(traced);
    seen.add(normCmp(traced.pathAtT));
  }

  for (const item of st.tracked) {
    if (seen.has(normCmp(item.pathAtT))) continue;
    const hay = [item.pathAtT, item.currentPath, item.relAtT].filter(Boolean).join('\n').toLocaleLowerCase().replace(/\//g, '\\');
    if (hay.includes(q)) {
      seen.add(normCmp(item.pathAtT));
      results.push({
        key: 'rel:' + normCmp(item.relAtT ?? item.pathAtT),
        name: leafName(item.pathAtT),
        relAtT: item.relAtT ?? item.pathAtT,
        pathAtT: item.pathAtT,
        currentPath: item.currentPath,
        currentRel: item.currentRel,
        status: item.status,
        steps: item.steps,
        isDir: item.isDir,
        size: item.size,
        existsNow: item.existsNow,
        lastSeq: item.lastSeq,
      });
    }
  }

  if (!expOnlyChanged && results.length < 120) {
    for (const [dirKey, list] of Object.entries(presentMap)) {
      if (!Array.isArray(list)) continue;
      const dirRel = dirKey === '.' ? '' : dirKey;
      for (const [name, isDirInt, size] of list) {
        const rel = dirRel ? dirRel + '/' + name : name;
        const abs = joinPath(rootTrim, rel);
        if (seen.has(normCmp(abs)) || st.arrivedAfterT.has(normCmp(abs)) || st.createdAfterT.has(normCmp(abs))) continue;
        if (rel.toLocaleLowerCase().replace(/\//g, '\\').includes(q)) {
          seen.add(normCmp(abs));
          results.push({
            key: 'rel:' + normCmp(rel),
            name,
            relAtT: rel,
            pathAtT: abs,
            currentPath: abs,
            currentRel: rel,
            status: 'unchanged',
            steps: [],
            isDir: Boolean(isDirInt),
            size: size || 0,
            existsNow: true,
            lastSeq: null,
          });
          if (results.length >= 150) break;
        }
      }
      if (results.length >= 150) break;
    }
  }
  return results;
}

function statusPillHtml(item) {
  if (item.status === 'unchanged') return `<span class="exp-dest-pill st-unchanged">${esc(t('expStUnchanged'))}</span>`;
  if (item.status === 'undone') return `<span class="exp-dest-pill st-undone">${esc(t('expStUndone'))}</span>`;
  const destDisp = item.status === 'rename'
    ? leafName(item.currentPath)
    : (item.currentRel !== null ? (parentRelPosix(item.currentRel) || '.') : (parentDir(item.currentPath) || item.currentPath));
  const key = item.status === 'rename' ? 'expStRename' : item.status === 'cross-move' ? 'expStCross' : 'expStMove';
  return `<span class="exp-dest-pill st-${esc(item.status)}">${esc(t(key, {dest: destDisp}))}</span>`;
}

function hasArrivedOrCreatedAncestor(rel, st) {
  let cur = rel;
  while (cur) {
    const absCmp = normCmp(joinPath(rootTrim, cur));
    if (st.arrivedAfterT.has(absCmp) || st.createdAfterT.has(absCmp)) return true;
    cur = parentRelPosix(cur);
  }
  return false;
}

function renderExplorerTree(st) {
  const folderSet = new Set(['']);
  for (const vf of st.virtualFolders) folderSet.add(vf);
  for (const item of st.tracked) {
    if (item.isDir && item.relAtT) folderSet.add(item.relAtT);
  }
  for (const [dirKey, list] of Object.entries(presentMap)) {
    const base = dirKey === '.' ? '' : dirKey;
    if (base && hasArrivedOrCreatedAncestor(base, st)) continue;
    if (base) folderSet.add(base);
    if (Array.isArray(list)) {
      for (const [name, isDirInt] of list) {
        if (!isDirInt) continue;
        const childRel = base ? base + '/' + name : name;
        if (!hasArrivedOrCreatedAncestor(childRel, st)) {
          folderSet.add(childRel);
        }
      }
    }
  }
  // Build parent -> children map
  const childrenOf = new Map();
  for (const f of folderSet) {
    if (!f) continue;
    const p = parentRelPosix(f);
    if (!childrenOf.has(p)) childrenOf.set(p, []);
    childrenOf.get(p).push(f);
  }
  for (const arr of childrenOf.values()) {
    arr.sort((a, b) => {
      const ac = (st.folderChangeCounts.get(a) || 0) > 0 ? 0 : 1;
      const bc = (st.folderChangeCounts.get(b) || 0) > 0 ? 0 : 1;
      if (ac !== bc) return ac - bc;
      return leafName(a).localeCompare(leafName(b), lang);
    });
  }
  const rows = [];
  function walk(rel, depth) {
    if (depth > 5) return;
    const active = rel === expCurDir;
    const cnt = st.folderChangeCounts.get(rel) || 0;
    const name = rel ? leafName(rel) : leafName(rootTrim) || t('expHome');
    const pad = 7 + depth * 14;
    rows.push(`<button type="button" class="exp-tree-node${active ? ' active' : ''}" data-exp-dir="${esc(rel)}" style="padding-left:${pad}px" title="${esc(rel || rootTrim)}">
      <span class="exp-ico" aria-hidden="true">${active ? '📂' : '📁'}</span>
      <span class="exp-tree-name">${esc(name)}</span>
      ${cnt ? `<span class="exp-tree-cnt">${cnt}</span>` : ''}
    </button>`);
    const kids = childrenOf.get(rel) || [];
    for (const kid of kids) walk(kid, depth + 1);
  }
  walk('', 0);
  $('expTree').innerHTML = rows.join('');
}

function renderExplorerCrumbs() {
  const segs = expCurDir ? expCurDir.split('/').filter(Boolean) : [];
  const parts = [`<button type="button" class="exp-crumb${segs.length ? '' : ' current'}" data-exp-dir="">${esc(rootTrim)}</button>`];
  let acc = '';
  for (let i = 0; i < segs.length; i++) {
    acc = acc ? acc + '/' + segs[i] : segs[i];
    const isLast = i === segs.length - 1;
    parts.push(`<span class="exp-crumb-sep" aria-hidden="true">›</span><button type="button" class="exp-crumb${isLast ? ' current' : ''}" data-exp-dir="${esc(acc)}">${esc(segs[i])}</button>`);
  }
  $('expCrumbs').innerHTML = parts.join('');
  $('expBack').disabled = !expNavStack.length;
  $('expUp').disabled = !expCurDir;
}

function renderExplorerInspector(item) {
  if (!item) {
    $('expInspector').innerHTML = `<div class="exp-empty">${esc(t('expInspEmpty'))}</div>`;
    return;
  }
  const destAbs = item.currentPath;
  const cachedStat = liveStatCache.get(normCmp(destAbs));
  const existsVal = cachedStat !== undefined ? cachedStat.exists : item.existsNow;
  const existBadge = existsVal === true
    ? `<span class="tag done">${esc(t('expInspExists'))}</span>`
    : existsVal === false
      ? `<span class="tag failed">${esc(t('expInspMissing'))}</span>`
      : (isLive ? `<span class="tag">${esc(t('expInspChecking'))}</span>` : '');

  const revealBtn = isLive
    ? `<button type="button" class="exp-btn-primary" id="expRevealBtn" data-reveal-path="${esc(destAbs)}">${esc(t('expRevealBtn'))}</button>`
    : `<button type="button" class="exp-btn-sec" id="expCopyRevealBtn" data-copy-reveal="${esc(destAbs)}">${esc(t('expCopyRevealCmd'))}</button>`;
  const logBtn = item.lastSeq ? `<button type="button" class="exp-btn-sec" data-exp-jump-seq="${item.lastSeq}">${esc(t('expViewLog'))}</button>` : '';
  const undoBtn = (item.lastSeq && item.status !== 'unchanged' && item.status !== 'undone')
    ? `<button type="button" class="exp-btn-sec" data-exp-undo-seq="${item.lastSeq}">${esc(t('copySingleUndo'))}</button>`
    : '';
  const toastHtml = expRevealStatus
    ? `<div class="exp-toast${expRevealStatus.ok ? '' : ' err'}">${esc(expRevealStatus.msg)}</div>`
    : '';

  const timelineHtml = item.steps && item.steps.length
    ? `<div class="exp-insp-box">
        <div class="exp-insp-label"><span>${esc(t('expTimelineTitle', {count: item.steps.length}))}</span></div>
        <ol class="exp-timeline">${item.steps.map(st => {
          const title = st.direction ? `${t(st.direction)} · ${t(st.kind)}` : t(st.kind);
          const inh = st.inherited ? `<div class="exp-timeline-meta">${esc(t('expInherited', {from: relPath(st.opBefore) || st.opBefore}))}</div>` : '';
          return `<li>
            <div><strong>#${st.seq} ${esc(title)}</strong></div>
            <div class="exp-timeline-meta">${esc(shortTime(st.time))}</div>
            ${inh}
            <div class="exp-insp-path">→ ${esc(relPath(st.to) || st.to)}</div>
          </li>`;
        }).join('')}</ol>
      </div>`
    : '';

  const offlineTip = !isLive
    ? `<div class="exp-tip">${esc(t('expOfflineTip'))}</div>`
    : '';

  $('expInspector').innerHTML = `
    <div class="exp-insp-head">
      <span class="exp-ico" style="font-size:20px" aria-hidden="true">${item.isDir ? '📁' : '📄'}</span>
      <div style="min-width:0;flex:1">
        <h3>${esc(item.name)}</h3>
        <div style="margin-top:4px">${statusPillHtml(item)}</div>
      </div>
    </div>
    <div class="exp-insp-box">
      <div class="exp-insp-label"><span>${esc(t('expInspBefore'))}</span></div>
      <div class="exp-insp-path">${esc(item.pathAtT)}</div>
    </div>
    <div class="exp-insp-box is-dest">
      <div class="exp-insp-label"><span>${esc(t('expInspAfter'))}</span>${existBadge}</div>
      <div class="exp-insp-path">${esc(destAbs)}</div>
    </div>
    <div class="exp-insp-actions">
      ${revealBtn}
      <button type="button" class="exp-btn-sec" data-copy-path="${esc(destAbs)}">${esc(t('expCopyPath'))}</button>
      ${logBtn}
      ${undoBtn}
    </div>
    ${toastHtml}
    ${timelineHtml}
    ${offlineTip}`;

  if (isLive && cachedStat === undefined) {
    fetchLiveStat(destAbs, item.key);
  }
}

async function fetchLiveDir(absDir) {
  const k = normCmp(absDir);
  if (liveDirCache.has(k)) return;
  try {
    const res = await fetch(data.apiBase + 'ls?path=' + encodeURIComponent(absDir));
    const json = await res.json();
    liveDirCache.set(k, (json && json.ok && Array.isArray(json.entries)) ? json.entries : []);
  } catch (_) {
    liveDirCache.set(k, []);
  }
  renderExplorer();
}

async function fetchLiveStat(absPath, itemKey) {
  const k = normCmp(absPath);
  if (liveStatCache.has(k)) return;
  try {
    const res = await fetch(data.apiBase + 'stat?path=' + encodeURIComponent(absPath));
    const json = await res.json();
    if (json && json.ok) liveStatCache.set(k, {exists: Boolean(json.exists), isDir: Boolean(json.isDir), size: json.size || 0});
  } catch (_) {}
  if (expSelectedKey === itemKey && appMode === 'explorer') renderExplorer();
}

async function revealLivePath(absPath) {
  expRevealStatus = null;
  try {
    const res = await fetch(data.apiBase + 'reveal', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Tidy-Action': 'reveal'},
      body: JSON.stringify({path: absPath}),
    });
    const json = await res.json();
    if (json && json.ok) {
      expRevealStatus = {ok: true, msg: t('expRevealOk')};
    } else {
      expRevealStatus = {ok: false, msg: (json && json.error) || 'Failed'};
    }
  } catch (_) {
    expRevealStatus = {ok: false, msg: 'Request failed'};
  }
  renderExplorer();
}

let currentVisibleItems = [];

function renderExplorer() {
  if (preview) return;
  if (!expState || expState.cutoffSeq !== expCutoffSeq) {
    expState = buildTimeMachine(expCutoffSeq);
  }
  const st = expState;
  renderExplorerTree(st);
  renderExplorerCrumbs();

  const searching = Boolean(expSearchQuery.trim());
  let list = [];
  let bannerHtml = '';

  if (searching) {
    list = searchExplorerAll(expSearchQuery, st);
    if (expOnlyChanged) list = list.filter(it => it.status !== 'unchanged');
    $('expCount').textContent = t('expSearchCount', {count: list.length});
    const traceHit = list.find(it => it.isTraceHit);
    if (traceHit) {
      bannerHtml = `<span><strong>${esc(t('expTraceHit'))}：</strong>${esc(relPath(traceHit.currentPath) || traceHit.currentPath)}</span>`;
    }
  } else {
    const view = getExplorerEntries(expCurDir, st);
    if (view.needsLiveFetch) {
      $('expListPane').innerHTML = `<div class="exp-empty">${esc(t('expLoadingDir'))}</div>`;
      fetchLiveDir(view.physicalDirAbs);
      return;
    }
    const allCount = view.entries.length;
    const changedCount = view.entries.filter(it => it.status !== 'unchanged').length;
    list = expOnlyChanged ? view.entries.filter(it => it.status !== 'unchanged') : view.entries;
    $('expCount').textContent = t('expCount', {total: allCount, changed: changedCount});
    if (view.movedAnc) {
      bannerHtml = `<span><strong>${esc(t('expInsideMoved'))}</strong> ${esc(relPath(view.movedAnc.mappedAbs) || view.movedAnc.mappedAbs)}</span>`;
    }
  }

  $('expBanner').hidden = !bannerHtml;
  $('expBanner').innerHTML = bannerHtml;
  currentVisibleItems = list;

  if (!list.length) {
    $('expListPane').innerHTML = `<div class="exp-empty">${esc(t(searching ? 'expEmptySearch' : 'expEmptyDir'))}</div>`;
    renderExplorerInspector(null);
    return;
  }

  let selected = list.find(it => it.key === expSelectedKey);
  if (!selected) {
    selected = list.find(it => it.status !== 'unchanged') || list[0];
    expSelectedKey = selected.key;
    expRevealStatus = null;
  }

  $('expListPane').innerHTML = `<table class="exp-table">
    <thead><tr><th>${esc(t('expColName'))}</th><th>${esc(t('expColWhere'))}</th><th style="text-align:right">${esc(t('expColSize'))}</th></tr></thead>
    <tbody>${list.map((it, idx) => {
      const isSel = it.key === selected.key;
      const isGhost = it.status !== 'unchanged' && it.status !== 'undone';
      const sub = searching
        ? `<span class="exp-item-sub">${esc(parentRelPosix(it.relAtT) || '.')}</span>`
        : (it.isDir && isGhost ? `<span class="exp-item-sub">${esc(t('expEnterMovedTip'))}</span>` : '');
      const sizeText = it.isDir ? t('expDirLabel') : formatBytes(it.size);
      return `<tr class="exp-row${isSel ? ' selected' : ''}${isGhost ? ' is-ghost' : ''}" data-exp-idx="${idx}">
        <td><div class="exp-name-cell"><span class="exp-ico" aria-hidden="true">${it.isDir ? '📁' : '📄'}</span><div><span class="exp-item-name">${esc(it.name)}</span>${sub}</div></div></td>
        <td>${statusPillHtml(it)}</td>
        <td class="exp-size-col">${esc(sizeText)}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
  renderExplorerInspector(selected);
}

function navigateExplorer(nextDir, {pushHistory = true, selectKey = ''} = {}) {
  const clean = (nextDir || '').replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
  if (pushHistory && clean !== expCurDir) expNavStack.push(expCurDir);
  expCurDir = clean;
  expSelectedKey = selectKey;
  expRevealStatus = null;
  renderExplorer();
}

function renderAppMode() {
  const showSwitch = !preview;
  $('modeSwitch').hidden = !showSwitch;
  $('livePill').hidden = !isLive;
  $('livePill').textContent = t('liveBadge');
  $('modeExplorer').textContent = t('modeExplorer');
  $('modeJournal').textContent = t('modeJournal');
  $('expBack').textContent = t('expBack');
  $('expUp').textContent = t('expUp');
  $('expHome').textContent = t('expHome');
  $('expTimeLabel').textContent = t('expTimeLabel');
  $('expSearch').placeholder = t('expSearchHint');
  $('expOnlyChangedLabel').textContent = t('expOnlyChangedLabel');
  const opts = buildTimepointOptions();
  $('expTimeSelect').innerHTML = opts.map(o => `<option value="${o.seq}">${esc(o.label)}</option>`).join('');
  $('expTimeSelect').value = String(expCutoffSeq);
  if (!showSwitch) {
    $('explorerPane').hidden = true;
    $('journalPane').hidden = false;
    return;
  }
  const inExp = appMode === 'explorer';
  $('modeExplorer').setAttribute('aria-pressed', String(inExp));
  $('modeJournal').setAttribute('aria-pressed', String(!inExp));
  $('explorerPane').hidden = !inExp;
  $('journalPane').hidden = inExp;
}

$('modeSwitch').addEventListener('click', event => {
  const btn = event.target.closest('button[data-app-mode]');
  if (!btn) return;
  appMode = btn.dataset.appMode;
  renderAppMode();
  if (appMode === 'explorer') renderExplorer();
  else { lastFlowKey = ''; render(); }
});
$('expTimeSelect').addEventListener('change', event => {
  expCutoffSeq = Number(event.target.value) || 0;
  expState = null;
  expSelectedKey = '';
  expRevealStatus = null;
  renderExplorer();
});
$('expBack').addEventListener('click', () => {
  if (!expNavStack.length) return;
  navigateExplorer(expNavStack.pop(), {pushHistory: false});
});
$('expUp').addEventListener('click', () => {
  const p = parentRelPosix(expCurDir);
  if (p !== null) navigateExplorer(p);
});
$('expHome').addEventListener('click', () => navigateExplorer(''));
$('expOnlyChanged').addEventListener('change', event => {
  expOnlyChanged = event.target.checked;
  renderExplorer();
});
$('expSearch').addEventListener('input', event => {
  clearTimeout(expSearchTimer);
  const val = event.target.value;
  expSearchTimer = setTimeout(() => {
    expSearchQuery = val;
    expSelectedKey = '';
    expRevealStatus = null;
    renderExplorer();
  }, 100);
});
$('expTree').addEventListener('click', event => {
  const btn = event.target.closest('button[data-exp-dir]');
  if (!btn) return;
  expSearchQuery = '';
  $('expSearch').value = '';
  navigateExplorer(btn.dataset.expDir);
});
$('expCrumbs').addEventListener('click', event => {
  const btn = event.target.closest('button[data-exp-dir]');
  if (!btn) return;
  expSearchQuery = '';
  $('expSearch').value = '';
  navigateExplorer(btn.dataset.expDir);
});
$('expListPane').addEventListener('click', event => {
  const row = event.target.closest('tr[data-exp-idx]');
  if (!row) return;
  const item = currentVisibleItems[Number(row.dataset.expIdx)];
  if (!item) return;
  expSelectedKey = item.key;
  expRevealStatus = null;
  // Update selection highlight in-place so dblclick fires reliably without tearing down the row DOM.
  for (const r of $('expListPane').querySelectorAll('tr.selected')) r.classList.remove('selected');
  row.classList.add('selected');
  renderExplorerInspector(item);
});
$('expListPane').addEventListener('dblclick', event => {
  const row = event.target.closest('tr[data-exp-idx]');
  if (!row) return;
  const item = currentVisibleItems[Number(row.dataset.expIdx)];
  if (!item) return;
  if (item.isDir && typeof item.relAtT === 'string' && !item.isTraceHit) {
    expSearchQuery = '';
    $('expSearch').value = '';
    navigateExplorer(item.relAtT);
  } else if (expSearchQuery.trim() && typeof item.relAtT === 'string') {
    const parent = parentRelPosix(item.relAtT);
    if (parent !== null) {
      expSearchQuery = '';
      $('expSearch').value = '';
      navigateExplorer(parent, {selectKey: item.key});
    }
  }
});
$('expInspector').addEventListener('click', event => {
  const revBtn = event.target.closest('[data-reveal-path]');
  if (revBtn) { revealLivePath(revBtn.dataset.revealPath); return; }
  const copyPathBtn = event.target.closest('[data-copy-path]');
  if (copyPathBtn) { copyCmdText(copyPathBtn.dataset.copyPath, copyPathBtn, 'expCopyPath'); return; }
  const copyRevBtn = event.target.closest('[data-copy-reveal]');
  if (copyRevBtn) {
    const p = copyRevBtn.dataset.copyReveal;
    const cmd = isWinRoot ? `explorer /select,"${p.replace(/"/g, '\\"')}"` : `open -R "${p.replace(/"/g, '\\"')}"`;
    copyCmdText(cmd, copyRevBtn, 'expCopyRevealCmd');
    return;
  }
  const undoBtn = event.target.closest('[data-exp-undo-seq]');
  if (undoBtn) {
    const seq = undoBtn.dataset.expUndoSeq;
    const cmd = `tidy-file-tree undo --journal "${journalPath.replace(/"/g,'\\"')}" --seq ${seq}${sysFlag} --dry-run`;
    copyCmdText(cmd, undoBtn, 'copySingleUndo');
    return;
  }
  const jumpBtn = event.target.closest('[data-exp-jump-seq]');
  if (jumpBtn) {
    const op = bySeq.get(Number(jumpBtn.dataset.expJumpSeq));
    if (!op) return;
    appMode = 'journal';
    selectedBatch = ALL_BATCHES;
    $('search').value = '';
    $('status').value = 'all';
    $('kind').value = 'all';
    renderAppMode();
    render(op);
  }
});
$('summary').addEventListener('click', event => {
  const card = event.target.closest('[data-stat-filter]');
  if (!card || preview) return;
  const next = card.dataset.statFilter;
  $('status').value = $('status').value === next ? 'all' : next;
  page = 0;
  render();
});
$('batchStrip').addEventListener('click', event => {
  const card = event.target.closest('[data-batch]');
  if (!card) return;
  selectedBatch = card.dataset.batch;
  page = 0;
  render();
});
$('batchJump').addEventListener('change', event => {
  selectedBatch = event.target.value;
  page = 0;
  render();
});
$('issueBatchesBtn').addEventListener('click', () => {
  onlyIssueBatches = !onlyIssueBatches;
  page = 0;
  render();
});
$('undoDrawerBtn').addEventListener('click', () => {
  undoDrawerOpen = !undoDrawerOpen;
  renderBatchStrip();
});
$('flowToggleBtn').addEventListener('click', () => {
  flowCollapsed = !flowCollapsed;
  lastFlowKey = '';
  render();
});
$('flowSvg').addEventListener('click', event => {
  const node = event.target.closest('[data-filter-path]');
  if (!node) return;
  const val = node.getAttribute('data-filter-path');
  $('search').value = $('search').value === val ? '' : val;
  page = 0;
  render();
});
$('pathModeBtn').addEventListener('click', () => { showFullPath = !showFullPath; lastFlowKey = ''; render(); });
$('pageSizeSelect').addEventListener('change', event => { pageSize = Number(event.target.value) || 24; page = 0; render(); });
$('toggleGroupsBtn').addEventListener('click', () => {
  const all = [...$('operations').querySelectorAll('details.dest-group')];
  const openAll = all.some(d => !d.open);
  for (const d of all) {
    d.open = openAll;
    if (openAll) {
      const body = d.querySelector('.dest-group-body');
      const dest = d.dataset.destGroup;
      if (body && !body.childElementCount && groupedData.has(dest)) body.innerHTML = renderGroupBody(dest, groupedData.get(dest));
    }
  }
  $('toggleGroupsBtn').textContent = t(openAll ? 'collapseAllGroups' : 'expandAllGroups');
});
$('operations').addEventListener('toggle', event => {
  const d = event.target;
  if (!d.matches?.('details.dest-group') || !d.open) return;
  const body = d.querySelector('.dest-group-body');
  const dest = d.dataset.destGroup;
  if (body && !body.childElementCount && groupedData.has(dest)) body.innerHTML = renderGroupBody(dest, groupedData.get(dest));
}, true);
$('language').addEventListener('change', event => applyLanguage(event.target.value));
$('theme').addEventListener('click', () => {
  const current = document.documentElement.dataset.theme;
  const dark = current ? current === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try {localStorage.setItem(themeKey,next);} catch (_) {}
});
$('viewToggle').addEventListener('click', event => {
  const btn = event.target.closest('button[data-view]');
  if (!btn) return;
  viewMode = btn.dataset.view;
  page = 0;
  render();
});
$('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { page = 0; render(); }, 110);
});
for (const id of ['status','kind']) $(id).addEventListener('change',() => {page = 0; render();});
$('firstPage').addEventListener('click',() => {page = 0; render();});
$('previous').addEventListener('click',() => {page--; render();});
$('next').addEventListener('click',() => {page++; render();});
$('lastPage').addEventListener('click',() => {page = 999999; render();});
$('pageInput').addEventListener('change', event => {
  const target = Number(event.target.value);
  if (Number.isFinite(target) && target >= 1) { page = target - 1; render(); }
});
$('operations').addEventListener('click',event => {
  const moreBtn = event.target.closest('[data-load-group]');
  if (moreBtn) {
    const dest = moreBtn.dataset.loadGroup;
    groupRenderLimit.set(dest, (groupRenderLimit.get(dest) ?? 20) + 50);
    const body = moreBtn.closest('.dest-group-body');
    if (body && groupedData.has(dest)) body.innerHTML = renderGroupBody(dest, groupedData.get(dest));
    return;
  }
  const copyBtn = event.target.closest('[data-copy-seq]');
  if (copyBtn) {
    const seq = copyBtn.dataset.copySeq;
    const cmd = `tidy-file-tree undo --journal "${journalPath.replace(/"/g,'\\"')}" --seq ${seq}${sysFlag} --dry-run`;
    copyCmdText(cmd, copyBtn, 'copySingleUndo');
    return;
  }
  const op = bySeq.get(Number(event.target.closest('[data-seq]')?.dataset.seq));
  if (!op) return;
  $('search').value = '';
  $('status').value = 'all';
  $('kind').value = 'all';
  render(op);
});
applyLanguage(lang);
</script>
</body>
</html>
