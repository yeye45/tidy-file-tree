<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TidyFileTree</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7fb;--surface:#fff;--tint:#eef3fa;--ink:#142038;--muted:#52647d;--line:#d4dfee;--wire:#9eb1c8;--blue:#245bcc;--selected:#e7f0ff;--green:#126b52;--green-bg:#e8f7f1;--purple:#64369a;--purple-bg:#f3ecfc;--amber:#8c4a08;--amber-bg:#fff3e2;--shadow:0 1px 2px rgba(15,28,50,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1621;--surface:#172231;--tint:#1f2e42;--ink:#ebf2fc;--muted:#9eb0c9;--line:#31455e;--wire:#5e7794;--blue:#8ab4ff;--selected:#1d3252;--green:#78dbb9;--green-bg:#17352c;--purple:#d4b4fa;--purple-bg:#2f2343;--amber:#ffca85;--amber-bg:#3b2b18;--shadow:0 1px 3px rgba(0,0,0,.28)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1621;--surface:#172231;--tint:#1f2e42;--ink:#ebf2fc;--muted:#9eb0c9;--line:#31455e;--wire:#5e7794;--blue:#8ab4ff;--selected:#1d3252;--green:#78dbb9;--green-bg:#17352c;--purple:#d4b4fa;--purple-bg:#2f2343;--amber:#ffca85;--amber-bg:#3b2b18;--shadow:0 1px 3px rgba(0,0,0,.28)}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;transition:border-color .15s,background-color .15s}
button:hover:not(:disabled){border-color:var(--blue);background:var(--tint)}
button:disabled{opacity:.5;cursor:default}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:11px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand-group{display:flex;align-items:center;gap:10px;min-width:0}
.folder{display:inline-block;position:relative;height:12px;width:16px;border:1.6px solid currentColor;border-radius:2.5px;color:var(--blue);flex:none;margin-top:2px}
.folder::before{content:"";position:absolute;left:-1.6px;top:-4.5px;width:7.5px;height:4px;border:1.6px solid currentColor;border-bottom:0;border-radius:2px 2px 0 0}
h1,h2,p{margin:0}
header.topbar h1{font-size:18px;letter-spacing:-.01em}
.root-path{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56vw}
.top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.primary{background:var(--blue);color:var(--surface);border-color:var(--blue);font-weight:650}
.primary:hover:not(:disabled){background:var(--blue);filter:brightness(1.08)}
.subbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
.summary{display:flex;align-items:center;gap:7px;color:var(--muted);min-width:0}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{padding:3px 9px;font-size:12px;border-radius:99px;background:var(--tint);color:var(--muted);border:1px solid transparent}
.pill[aria-pressed="true"]{background:var(--selected);color:var(--blue);border-color:var(--blue);font-weight:650}
.zoom-group{display:inline-flex;align-items:center;gap:2px}
.zoom-group button{padding:3px 7px;font-size:12px;min-width:28px}
.zoom-label{font-size:12px;color:var(--muted);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);min-height:0;overflow:hidden}
.canvas-pane{display:grid;grid-template-rows:minmax(0,1fr);min-width:0;min-height:0;border-right:1px solid var(--line);position:relative}
.viewport{overflow:auto;min-height:0;background:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px;cursor:grab}
.viewport.panning{cursor:grabbing;user-select:none}
.board-stage{transform-origin:0 0;min-width:100%;min-height:100%;display:inline-block}
.board{--node-width:246px;--gap:44px;position:relative;padding:22px 48px 56px 22px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire-path{fill:none;stroke:var(--wire);stroke-width:1.5;opacity:.72}
.wire-path.active{stroke:var(--blue);stroke-width:2.5;opacity:1}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree li{display:grid;grid-template-columns:var(--node-width) minmax(0,max-content);gap:var(--gap);align-items:center}
.tree ul{display:grid;gap:9px}
.node-wrap{position:relative;width:var(--node-width)}
.node{display:grid;gap:4px;min-height:74px;width:100%;min-width:0;position:relative;text-align:left;padding:8px 30px 8px 12px;background:var(--surface);border:1px solid var(--line);border-left:3.5px solid var(--line);border-radius:10px;overflow-wrap:anywhere;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,background-color .15s}
.node.st-judged{border-left-color:var(--green)}
.node.st-review{border-left-color:var(--purple)}
.node.st-skipped,.node.st-unreadable{border-left-color:var(--amber)}
.node.st-scanning{border-left-color:var(--blue)}
.node:hover{border-color:var(--blue)}
.node[aria-pressed="true"]{border-color:var(--blue);background:var(--selected);box-shadow:inset 0 0 0 1px var(--blue),0 0 0 3px color-mix(in srgb,var(--blue) 16%,transparent)}
.node.dimmed{opacity:.32}
.node.matched{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-bg)}
.node-name{display:flex;align-items:center;gap:7px;font-weight:650;min-width:0}
.node-title{min-width:0;overflow-wrap:anywhere;word-break:break-word;line-height:1.3}
.kind-ico{width:15px;height:15px;flex:none;color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.node.st-skipped .kind-ico,.node.st-unreadable .kind-ico{color:var(--amber)}
.node.st-review .kind-ico{color:var(--purple)}
.node.st-judged .kind-ico{color:var(--green)}
.collapse-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;border-radius:50%;font-size:11px;line-height:1;display:grid;place-items:center;color:var(--muted);background:var(--tint);border:1px solid var(--line);z-index:2}
.collapse-btn:hover{border-color:var(--blue);color:var(--blue)}
.collapsed-count{position:absolute;right:-10px;top:-7px;padding:0 5px;border-radius:99px;font-size:10px;font-weight:700;background:var(--blue);color:var(--surface);pointer-events:none;z-index:3}
.badge{display:inline-flex;align-items:center;gap:5px;width:fit-content;max-width:100%;border-radius:99px;padding:1px 8px;font-size:11.5px;color:var(--muted);background:var(--tint);overflow-wrap:anywhere}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.scanning{color:var(--blue);background:var(--selected)}
.badge.scanning::before{animation:pulse 1s infinite}
.badge.judged{color:var(--green);background:var(--green-bg)}
.badge.review{color:var(--purple);background:var(--purple-bg)}
.badge.skipped,.badge.unreadable{color:var(--amber);background:var(--amber-bg)}
.type{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;font-size:12.5px}
.type span:first-child{color:var(--muted);font-size:11.5px}
.type strong{font-weight:620}
.draft-tag{color:var(--blue);font-size:11.5px;font-weight:600}
.inspector{background:var(--surface);overflow:auto;min-height:0;display:flex;flex-direction:column}
.details{padding:14px 16px;display:grid;gap:10px}
.details h2{font-size:16px;overflow-wrap:anywhere}
.muted{color:var(--muted);overflow-wrap:anywhere;font-size:12.5px}
.details dl{margin:0;display:grid;gap:7px;padding:10px;border-radius:9px;background:var(--tint)}
.details dl div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:baseline}
.details dt{color:var(--muted);font-size:12px}
.details dd{margin:0;overflow-wrap:anywhere;font-size:13px}
.draft-tools,.drafts{border-top:1px solid var(--line);padding:12px 16px}
.draft-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--bg)}
.draft-tools button,.draft-tools select{font-size:12.5px;padding:5px 9px;max-width:100%}
.draft-tools button{color:var(--blue)}
.drafts{display:grid;gap:10px;overflow-wrap:anywhere}
.drafts details{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface)}
.drafts summary{cursor:pointer;font-weight:620;font-size:13px}
.draft-issues{margin:8px 0;padding:7px 10px 7px 24px;border-radius:7px;background:var(--amber-bg);color:var(--amber);font-size:12px}
.drafts p,.drafts table{margin-top:6px}
.drafts ul{margin:5px 0;padding-inline-start:18px;font-size:12.5px}
.drafts table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}
.drafts th,.drafts td{padding:5px 6px;text-align:left;vertical-align:top;border-top:1px solid var(--line);overflow-wrap:anywhere}
.drafts th{color:var(--muted)}
.ai-review{margin:8px 0;padding:9px 11px;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;background:var(--selected)}
.ai-review h2{font-size:13.5px;margin-bottom:3px}
.ai-review dl{margin:6px 0 0;display:grid;gap:5px;font-size:12.5px}
.ai-review dt{font-weight:620;color:var(--muted)}
.ai-review dd{margin:0;white-space:pre-wrap}
#ai-message{flex-basis:100%;font-size:12px}
@media(max-width:959px){
  body{height:auto;min-height:100dvh;display:block}
  .workspace{display:block;overflow:visible}
  .canvas-pane{border-right:0;border-bottom:1px solid var(--line)}
  .viewport{max-height:58vh;min-height:300px}
  .inspector{overflow:visible}
  .root-path{max-width:85vw}
}
@media(max-width:620px){
  header.topbar,.subbar{padding:9px 11px}
  .board{width:auto!important;padding:11px}
  .wires{display:none}
  .tree li{display:block;position:relative}
  .tree ul{margin:7px 0 0 10px;padding:0 0 0 9px;border-left:1px solid var(--wire)}
  .tree ul>li::before{content:"";width:9px;border-top:1px solid var(--wire);position:absolute;left:-9px;top:18px}
  .node-wrap{width:100%}
  .node{min-height:0}
  .details dl div{grid-template-columns:minmax(0,1fr);gap:2px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-group"><span class="folder" aria-hidden="true"></span><div><h1 id="title"></h1><p class="root-path" id="root"></p></div></div>
  <div class="top-actions">
    <select id="lang-select" aria-label="Language"><option value="zh-CN">简体中文</option><option value="en">English</option></select>
    <button type="button" id="stop-scan" hidden></button>
    <button type="button" id="rescan" class="primary"></button>
    <button type="button" id="theme" aria-label="Toggle theme">◐</button>
  </div>
</header>
<div class="subbar">
  <div class="summary" role="status"><span class="pulse" id="scan-pulse" hidden></span><span id="summary"></span></div>
  <div class="controls">
    <div class="pills" id="status-pills">
      <button type="button" class="pill" data-filter="all" aria-pressed="true"></button>
      <button type="button" class="pill" data-filter="review" aria-pressed="false"></button>
      <button type="button" class="pill" data-filter="judged" aria-pressed="false"></button>
      <button type="button" class="pill" data-filter="skipped" aria-pressed="false"></button>
      <button type="button" class="pill" data-filter="drafts" aria-pressed="false"></button>
    </div>
    <input type="search" id="tree-search">
    <span class="zoom-group" id="match-nav" hidden>
      <button type="button" id="match-prev" aria-label="Previous match">‹</button>
      <span class="zoom-label" id="match-pos">0/0</span>
      <button type="button" id="match-next" aria-label="Next match">›</button>
    </span>
    <button type="button" id="expand-all"></button>
    <div class="zoom-group">
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-fit"></button>
    </div>
  </div>
</div>
<main class="workspace">
  <section class="canvas-pane">
    <div class="viewport" id="viewport">
      <div class="board-stage" id="board-stage">
        <div class="board" id="board"><svg class="wires" id="wires" aria-hidden="true"></svg><ul class="tree" id="tree"></ul></div>
      </div>
    </div>
  </section>
  <aside class="inspector">
    <section class="details" id="details" aria-live="polite"></section>
    <div class="draft-tools" id="draft-tools" hidden>
      <label id="draft-label" for="draft-node" hidden></label><select id="draft-node" hidden></select>
      <button type="button" id="draft-download"></button>
      <button type="button" id="ai-export" hidden></button><button type="button" id="ai-import" hidden></button>
      <input type="file" id="ai-file" accept=".json,application/json" hidden>
      <span id="ai-count" class="muted" hidden></span><p id="ai-message" class="muted" role="status" hidden></p>
    </div>
    <section class="drafts" id="drafts" hidden></section>
  </aside>
</main>
<script type="application/json" id="config">__SCAN_CONFIG__</script>
<script>

const $ = id => document.getElementById(id);
const config = JSON.parse($('config').textContent);
let lang = config.lang === 'en' ? 'en' : 'zh-CN';
const themeKey = 'tidy-file-tree-theme';
const svgNS = 'http://www.w3.org/2000/svg';
try {
  const savedTheme = localStorage.getItem(themeKey) ?? localStorage.getItem('packtidy-theme');
  if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
} catch (_) {}
const labels = {
  title:['目录判断树','Directory assessment tree'], restart:['重新扫描','Scan again'], stop:['停止扫描','Stop scan'],

  searchHint:['搜索目录名…','Search folders…'], expandAll:['全部展开','Expand all'], collapseDeep:['收起深层','Collapse deep'], zoomFit:['适应','Fit'],

  collapseNode:['收起子目录','Collapse children'], expandNode:['展开子目录','Expand children'],
  queued:['待检查','Queued'], scanning:['扫描中','Scanning'], judged:['已判断','Assessed'], review:['待复核','Needs review'],
  skipped:['受保护跳过','Protected · skipped'], unreadable:['无法读取','Unreadable'],
  type:['类型','Type'], candidate:['候选类型','Candidate type'], unknown:['未判定','Undetermined'],
  container:['容器目录','Folder container'], empty:['空目录','Empty folder'], runtime:['软件运行环境','Software runtime'],

  images:['图片目录','Images'], videos:['视频目录','Videos'], series:['剧集目录','Episode collection'],
  audio:['音频目录','Audio'], archives:['压缩包目录','Archives'], documents:['文档目录','Documents'],
  basis:['判断依据','Evidence'], unity:['检测到可执行文件与同名 _Data 目录成套出现。','An executable and its matching _Data folder are present.'],

  vmBasis:['本层包含虚拟机磁盘文件。','Immediate entries include virtual disk files.'],
  containerBasis:['本层主要由子目录构成。','The inspected level is organized into subfolders.'],
  emptyBasis:['本层为空（无可见文件或子目录）。','No visible files or subfolders were found at this level.'],

  mixed:['现有目录结构线索不足，建议人工复核。','Structural evidence is inconclusive; manual review recommended.'],
  counts:['本层条目','Immediate entries'], countValues:['{files} 个文件 · {folders} 个子目录','{files} files · {folders} subfolders'],

  drafts:['归组草稿','Grouping drafts'], exportDrafts:['下载归组草稿 (.json)','Download drafts (.json)'],

  unpaired:['未配对字幕','Unpaired subtitles'], subtitle:['字幕','Subtitle'],
  group:['{title} · 第 {season} 季 · {folders} 个关联目录','{title} · Season {season} · {folders} related folders'],
  draftStatus:['草稿就绪','Draft ready'], groupReview:['待确认','Needs review'],
  readOnly:['以下为仅凭文件名生成的只读草稿，尚未改动任何文件（路径相对于扫描根目录）。','Read-only drafts generated from filenames; no files have been changed (paths relative to scan root).'],
  source:['原路径','Source path'], target:['建议落点','Proposed destination'], blocked:['落点待确认','Destination needs review'],
  incompleteGroup:['来源目录包含受保护跳过项，或扫描未完全展开。','Entries were skipped or the scan of this group is incomplete.'],

  duplicateEpisode:['存在重复集号，请核对是否为多版本或重复文件。','Duplicate episode numbers found.'],

  blockedTarget:['部分建议目标命中保护规则或不可用。','Some destination paths are protected or unavailable.'],
  nameConflict:['目标位置已存在同名文件。','Filename conflicts detected at the proposed destination.'],
  aiExport:['导出 AI 复核问题','Export AI review questions'], aiImport:['导入 AI 回答','Import AI answers'],
  aiCount:['AI 复核 {total} 条 · 已回填 {count} 条','AI review · {count} of {total} answered'],
  aiNodeCount:['AI 已回填 {count} 条','AI answers: {count}'], aiRecorded:['已回填 AI 建议','AI answer imported'],

  aiImportError:['无法解析回答文件：请确认导入的是符合问题文件 answerFormat 格式的 JSON。','Unable to read answers. Import JSON using the answerFormat from the question file.'],

  aiHypothesis:['猜想','Hypothesis'], aiMethod:['验证方式','Verification method'], aiFindings:['核查发现','Findings'],

  group_together:['建议合并到一起','Suggest grouping together'], keep_separate:['建议分开保留','Suggest keeping separate'],

      if (node.name.toLocaleLowerCase().includes(q)) {
        for (let p = nodes.get(node.parent); p; p = nodes.get(p.parent)) {
          if (collapsed.delete(p.id)) refreshCollapseControl(p);
        }
      }
    }
  }
  render();
});
$('stop-scan').addEventListener('click',() => {
  if (stream && overall === 'scan') {
    stream.close();
    stream = null;
    overall = 'paused';
    render();
  }
});
$('lang-select').addEventListener('change',event => {lang = event.target.value; applyChrome();});
$('theme').addEventListener('click',() => {
  const current = document.documentElement.dataset.theme;
  const dark = current ? current === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try {localStorage.setItem(themeKey,next);} catch (_) {}
});
// Canvas drag-to-pan on empty background
let pan = null;
$('viewport').addEventListener('pointerdown',event => {
  if (event.button !== 0 || event.target.closest('button')) return;
  pan = {id:event.pointerId,x:event.clientX,y:event.clientY,sl:$('viewport').scrollLeft,st:$('viewport').scrollTop};
  $('viewport').classList.add('panning');
  $('viewport').setPointerCapture(event.pointerId);
});
$('viewport').addEventListener('pointermove',event => {
  if (!pan || event.pointerId !== pan.id) return;
  $('viewport').scrollLeft = pan.sl - (event.clientX - pan.x);
  $('viewport').scrollTop = pan.st - (event.clientY - pan.y);
});
$('viewport').addEventListener('pointerup',event => {
  if (!pan || event.pointerId !== pan.id) return;
  pan = null;
  $('viewport').classList.remove('panning');
});
$('viewport').addEventListener('pointercancel',() => {pan = null; $('viewport').classList.remove('panning');});
$('draft-node').addEventListener('change',event => {
  if (event.target.value === '') return;
  const id = Number(event.target.value);
  selectNode(id);
  nodes.get(id).button.scrollIntoView({block:'nearest',inline:'nearest'});
});
function downloadJson(filename, data) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}));
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href),1000);
}
function exportReviewQuestions() {
  const questions = [...reviewQuestions.values()].map(({question}) => question);
  const issues = new Set(questions.flatMap(question => question.issues));
  const answerFormat = {format:ANSWER_FORMAT,answers:[{id:'<question id>',hypothesis:'<text>',
    verification:{method:'<text>',findings:'<text>'},confirmation:{recommendation:recommendations.join('|'),
      confidence:confidenceLevels.join('|'),why:'<text>',residualRisk:'<text>'}}]};
  downloadJson('tidy-file-tree-ai-questions.json',{format:'tidy-file-tree-scan-review-questions-v1',
    language:lang,instructions:t('aiPrompt'),answerFormat,
    issueDescriptions:Object.fromEntries([...issues].map(issue => [issue,t(issue)])),questions});
}
function parseAnswer(item) {
  const {hypothesis,verification,confirmation} = item;
  const fields = [hypothesis,verification?.method,verification?.findings,confirmation?.why,confirmation?.residualRisk];
  if (!fields.every(value => typeof value === 'string' && value.trim()) ||
      !recommendations.includes(confirmation?.recommendation) || !confidenceLevels.includes(confirmation?.confidence)) return null;
  return {hypothesis,verification:{method:verification.method,findings:verification.findings},
    confirmation:{recommendation:confirmation.recommendation,confidence:confirmation.confidence,
      why:confirmation.why,residualRisk:confirmation.residualRisk}};
}
async function importReviewAnswers(file) {
  const current = stream;
  let payload;
  try {
    payload = JSON.parse((await file.text()).replace(/^\uFEFF/,''));
  } catch {
    payload = null;
  }
  if (stream !== current) return;
  const message = $('ai-message');
  message.hidden = false;
  if (payload?.format !== ANSWER_FORMAT || !Array.isArray(payload.answers)) {
    message.textContent = t('aiImportError');
    return;
  }
  const occurrences = new Map();
  for (const item of payload.answers) {
    if (typeof item?.id === 'string') occurrences.set(item.id,(occurrences.get(item.id) ?? 0)+1);
  }
  let count = 0, invalid = 0, unmatched = 0;
  const affected = new Set();
  for (const item of payload.answers) {
    const answer = typeof item?.id === 'string' && occurrences.get(item.id) === 1 && parseAnswer(item);
    if (!answer) { invalid++; continue; }
    const review = reviewQuestions.get(item.id);
    if (!review) { unmatched++; continue; }
    reviewAnswers.set(item.id,answer);
    affected.add(review.node);
    count++;
  }
  message.textContent = t('aiImportResult',{count,invalid,unmatched});
  updateReviewStatus();
  if (affected.size && !affected.has(selected)) selectNode(affected.values().next().value);
  draftSelection = undefined;
  renderDrafts();
  render();
}
$('ai-export').addEventListener('click',exportReviewQuestions);
$('ai-import').addEventListener('click',() => $('ai-file').click());
$('ai-file').addEventListener('change',event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (file) importReviewAnswers(file);
});
$('draft-download').addEventListener('click',() => {
  const root = nodes.get(0).path;
  const report = {root,limited:overall === 'incomplete',
    inventories:[...inventories.values()].map(({path,episodes,unpaired}) => ({path,episodes,unpaired})),
    groups:[...drafts].flatMap(([id,groups]) => groups.map(({title,season,folders,issues,rows}) =>
      ({parent:nodes.get(id).path,title,season,folders,issues,rows})))};
  downloadJson('tidy-file-tree-drafts.json',report);
});
$('rescan').addEventListener('click',start);
$('tree').addEventListener('click',event => {
  const toggle = event.target.closest('button[data-toggle]');
  if (toggle) {
    const id = Number(toggle.dataset.toggle);
    if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
    refreshCollapseControl(nodes.get(id));
    render();
    return;
  }
  const button = event.target.closest('button[data-id]');
  if (!button) return;
  selectNode(Number(button.dataset.id));
});
$('tree').addEventListener('keydown',event => {
  const button = event.target.closest('button[data-id]');
  if (!button) return;
  const node = nodes.get(Number(button.dataset.id));
  if (!node) return;
  let targetId = null;
  if (event.key === 'ArrowLeft' && node.parent !== null) targetId = node.parent;
  else if (event.key === 'ArrowRight' && node.childIds.length) {
    if (collapsed.delete(node.id)) refreshCollapseControl(node);
    targetId = node.childIds[0];
  } else if ((event.key === 'ArrowUp' || event.key === 'ArrowDown') && node.parent !== null) {
    const siblings = nodes.get(node.parent).childIds;
    const idx = siblings.indexOf(node.id);
    const nextIdx = event.key === 'ArrowUp' ? idx - 1 : idx + 1;
    if (nextIdx >= 0 && nextIdx < siblings.length) targetId = siblings[nextIdx];
  }
  if (targetId !== null) {
    event.preventDefault();
    selectNode(targetId);
    nodes.get(targetId)?.button.focus();
  }
});
window.addEventListener('resize',render);
applyChrome();
start();
</script>
</body>
